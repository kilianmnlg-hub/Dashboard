<script>
/* src/palette.js */
/* Raumspiel – Farbrampen
 * Jede Farbfamilie hat 8 Stufen (0 = tiefster Schatten ... 7 = Glanzlicht). Schatten wandern ins Violette, Lichter ins Warme.
 * Alles im Spiel verweist nur auf Rampe + Stufe, dadurch bleibt der Look einheitlich und Tag/Nacht/Licht laesst sich als Stufenverschiebung rechnen.
 * Voxel-Code (16 Bit): Bit 0-2 Stufe, Bit 3-8 Rampe (1..63, 0 = leer), Bit 9 selbstleuchtend, Bit 10 dynamisch, Bit 11-15 Dyn-Nummer.

    ['magenta', 316, 0.46, 0.50],
    ['pink', 336, 0.62, 0.74],
    ['rose', 350, 0.50, 0.62],
    ['terracotta', 14, 0.50, 0.50],
    ['brick', 11, 0.48, 0.36],
    ['sand', 40, 0.44, 0.76],
    ['leather', 26, 0.52, 0.30],
    ['skin1', 24, 0.58, 0.74],
    ['skin2', 22, 0.48, 0.58],

  P.init = function (G_, world_, scene_) { G = G_; world = world_; scene = scene_; acc = 0; };

  P.update = function (dt) {

    const step = acc; acc = 0;
    if (G.mode === 'build') return;
    let changed = false;

    if (changed) scene.itemsDirty = true;

  function reset(it) {
    const r = RS.dims(it.d, it.rot);

    pt.t += dt;
    if (pt.on && pt.st !== 'jump' && ((A.state === 'act' && A.act && A.act.it === pt.on) || !world.items.includes(pt.on))) leaveSpot(pt);

  function idle(pt, K) {

  }

  function think(pt, K) {

    let tot = 0; opts.forEach((o) => (tot += o[1]));

    if (pick === 'wander') { for (let k = 0; k < 6; k++) { const q = randomPoint(); if (q && startPath(pt, q[0], q[1])) return; } }
    else if (pick === 'follow' && A.item) { for (let k = 0; k < 3; k++) { const a = rnd(0, 6.28); if (startPath(pt, A.x + Math.cos(a) * 26, A.y + Math.sin(a) * 26)) { pt.then = 'near'; return; } } }

    return footOk(pt.d, px, py, face, 'sit');
  }
  // naechste Stelle um (x,y), an der das Tier sitzen kann; bevorzugt eine, von der es auch wieder losgehen kann. Dreht sich bei Bedarf.
  function nearSpot(d, x, y, face) {
    const gi = RS.avatar.gridInfo(), C = gi.cell, cx = Math.floor(x / C), cy = Math.floor(y / C), cand = [];
    for (let dy = -12; dy <= 12; dy++) for (let dx = -12; dx <= 12; dx++) cand.push([dx * dx + dy * dy, cx + dx, cy + dy]);
    cand.sort((a, b) => a[0] - b[0]);
    for (const roomyOnly of [true, false]) for (const c of cand) {
      if (c[1] < 0 || c[2] < 0 || c[1] >= gi.gw || c[2] >= gi.gh) continue;
      const px = c[1] * C + C / 2, py = c[2] * C + C / 2;
      for (let k = 0; k < 4; k++) {
        const f = (face + k) & 3;
        if (footOk(d, px, py, f, 'sit') && (!roomyOnly || !okGrid(d, f)[c[2] * gi.gw + c[1]])) return [px, py, f];
      }
    }
    return null;
  }
  // Raum veraendert (Moebel verschoben oder daneben abgestellt): Weg und Standort noch gut? Sonst anhalten bzw. zur naechsten Stelle mit Platz
  function revalidate(pt) {
    if (pt.st === 'walk') {
      if (fits(pt, 'walk') && walkOk(pt, pt.path)) return;
      pt.path = []; pt.then = null; pt.st = 'sit'; pt.t = 0; pt.until = 1;
    }
    const st = pt.st === 'rest' ? 'rest' : 'sit';
    if (fits(pt, st)) return;
    if (st === 'rest' && fits(pt, 'sit')) { pt.st = 'sit'; pt.t = 0; pt.until = 2; return; }
    const q = nearSpot(pt.d, pt.x, pt.y, pt.face);
    if (q) { pt.x = q[0]; pt.y = q[1]; pt.face = q[2]; pt.path = []; pt.then = null; pt.st = 'sit'; pt.t = 0; pt.until = 1.5; }
  }
  function pickSpot(pt) {
    const A = RS.avatar, cands = [];
    if (!RS.ACTS) return null;
    for (const o of world.items) {
      if (o.d.pet || !RS.ACTS[o.t]) continue;
      if (A.state === 'act' && A.act && A.act.it === o) continue;
      if (world.items.some((q) => q.d.pet && q.pt && q.pt.on === o)) continue;
      const a = RS.ACTS[o.t].find((q) => OKPOSE[q.pose] && !q.needs);
      if (a) cands.push([o, a]);
    }
    while (cands.length) {                                                   // zufaellig ein Moebel, vor dem das Tier ueberhaupt Platz zum Absprung hat
      const [o, a] = cands.splice(Math.floor(Math.random() * cands.length), 1)[0], sp = RS.avatar.spotOf(o, a), L = launch(pt, sp);
      if (L) return { it: o, x: sp.x, y: sp.y, z: o.z + a.z, ex: sp.ex, ey: sp.ey, face: sp.face, lx: L[0], ly: L[1], lface: L[2] };
    }
    return null;
  }
  // Absprungstelle vor dem Moebel: von der Ausstiegsstelle der Figur nach aussen, bis das Tier dort losgehen kann, bevorzugt mit der Nase zum Moebel,
  // sonst quer dazu (in engen Gaengen springt es seitlich auf)
  function launch(pt, sp) {
    const gi = RS.avatar.gridInfo(), C = gi.cell, dx = sp.ex - sp.x, dy = sp.ey - sp.y, len = Math.hypot(dx, dy) || 1, toward = faceOf(-dx, -dy);
    const faces = [toward, (toward + 1) & 3, (toward + 3) & 3], oks = faces.map((f) => okGrid(pt.d, f));
    for (const extra of [0, 3, 6, 9, 12, 16, 20]) {
      const cx = Math.floor((sp.ex + dx / len * extra) / C), cy = Math.floor((sp.ey + dy / len * extra) / C);
      if (cx < 0 || cy < 0 || cx >= gi.gw || cy >= gi.gh) continue;
      for (let i = 0; i < 3; i++) if (!oks[i][cy * gi.gw + cx]) return [cx * C + C / 2, cy * C + C / 2, faces[i]];
    }
    return null;
  }

  function walk(pt, K, dt) {
    let step = K.speed * dt;
    while (step > 0 && pt.path.length) {
      const q = pt.path[0], dx = q[0] - pt.x, dy = q[1] - pt.y, d = Math.hypot(dx, dy);
      pt.face = q[2];
      if (d < 0.01) { pt.path.shift(); continue; }
      const m = Math.min(step, d); pt.x += dx / d * m; pt.y += dy / d * m; step -= m;
      if (m >= d - 0.001) pt.path.shift();
    }
    pt.fr = 3 + (Math.floor(pt.t * K.rate) % 4);
    if (pt.path.length) return;
    const then = pt.then; pt.then = null; pt.t = 0;
    if (then && then.it) { startJump(pt, then.x, then.y, then.z, then.lface, then); return; }
    pt.st = 'sit'; pt.until = then === 'near' ? rnd(6, 14) : rnd(K.sit[0], K.sit[1]);
    const A = RS.avatar;
    if (A.item && Math.hypot(A.x - pt.x, A.y - pt.y) < 60 && Math.random() < 0.25) RS.audio.sfx(K.sound);
  }

  function startJump(pt, x, y, z, face, spot) {
    pt.st = 'jump'; pt.tj = 0; pt.dur = 0.55; pt.jf = [pt.x, pt.y, pt.z]; pt.jt = [x, y, z]; pt.jspot = spot || null;
    if (spot) pt.exit = [spot.ex, spot.ey];
    if (face != null) pt.face = face;
  }
  function jump(pt, K, dt) {
    pt.tj += dt;
    const u = Math.min(1, pt.tj / pt.dur), e = u * u * (3 - 2 * u);
    pt.x = pt.jf[0] + (pt.jt[0] - pt.jf[0]) * e; pt.y = pt.jf[1] + (pt.jt[1] - pt.jf[1]) * e;
    pt.z = pt.jf[2] + (pt.jt[2] - pt.jf[2]) * e + Math.sin(u * Math.PI) * 7;
    pt.fr = u > 0.5 ? 5 : 4;
    if (u < 1) return;
    pt.z = pt.jt[2]; pt.t = 0;
    if (pt.jspot) { pt.on = pt.jspot.it; pt.face = pt.jspot.face; pt.st = 'rest'; pt.until = rnd(K.rest[0], K.rest[1]); } else { pt.on = null; pt.st = 'sit'; pt.until = rnd(K.sit[0], K.sit[1]); }
    pt.jspot = null;
  }
  function leaveSpot(pt) {
    const q = landing(pt);
    pt.on = null; startJump(pt, q[0], q[1], 0, q[2], null);
  }
  // Landestelle: von der Ausstiegsstelle nach aussen, bis das Tier in seiner Blickrichtung sitzen und wieder losgehen kann; sonst naechster Platz mit Raum
  function landing(pt) {
    const gi = RS.avatar.gridInfo(), C = gi.cell, ex = pt.exit ? pt.exit[0] : pt.x, ey = pt.exit ? pt.exit[1] : pt.y, dx = ex - pt.x, dy = ey - pt.y, len = Math.hypot(dx, dy), ok = okGrid(pt.d, pt.face);
    if (len > 1) for (const extra of [0, 3, 6, 9, 12, 16, 20]) {
      const cx = Math.floor((ex + dx / len * extra) / C), cy = Math.floor((ey + dy / len * extra) / C), px = cx * C + C / 2, py = cy * C + C / 2;
      if (cx >= 0 && cy >= 0 && cx < gi.gw && cy < gi.gh && !ok[cy * gi.gw + cx] && footOk(pt.d, px, py, pt.face, 'sit')) return [px, py, pt.face];
    }
    return nearSpot(pt.d, ex, ey, pt.face) || [pt.x, pt.y, pt.face];
  }

  const floorZ = (x, y) => RS.avatar.floorZ(x, y);
  function put(it, pt) {
    const rot = pt.face & 3, fr = pt.fr | 0;
    let ch = false;
    if (rot !== it.rot || fr !== it.frame) { it.rot = rot; it.frame = fr; world.refreshSprite(it); ch = true; }
    const r = RS.dims(it.d, it.rot);
    let x = Math.round(pt.x - r.w / 2), y = Math.round(pt.y - r.d / 2);
    if ((x + y) & 1) { if (pt.x - r.w / 2 > x) x += 1; else x -= 1; }
    const z = Math.round(pt.z) + (pt.on || pt.st === 'jump' ? 0 : floorZ(pt.x, pt.y));
    if (x !== it.x || y !== it.y || z !== it.z) { it.x = x; it.y = y; it.z = z; ch = true; }
    pt.lx = it.x; pt.ly = it.y; pt.lz = it.z;
    return ch;
  }

  P.dbg = { footprint, footOk, walkOk, faceOf, okGrid, planPath, launch, pickSpot, nearSpot, landing };

  // Klick im Spielmodus: streicheln
  P.touch = function (it) {
    const K = KIND[it.d.petKind];
    RS.audio.sfx(K ? K.sound : 'meow');
    G.puff(it.x + 6, it.y + 6, it.z + 12, 4, [255, 154, 193], true);
    const pt = it.pt;
    if (pt && !pt.on && pt.st !== 'jump') { pt.path = []; pt.st = 'sit'; pt.t = 0; pt.until = 5; pt.then = null; }
  };
})(window);

</script>
<script>
/* src/levels.js */
/* Raumspiel – Freischaltung nach Level: Alles Neue wird mit hoeheren Leveln verfuegbar und dann mit Stunden gekauft.
 * Teile aus Kilians Zimmer (mine) sind von Anfang an frei. Alle anderen Teile verteilen sich ueber die Level 0..19 (je Level etwa 13 neue Teile):
 * innerhalb jeder Kategorie wandert es nach Preis nach oben (billig frueh, teuer spaet), Grundausstattung (Kuehlschrank, Herd, WC, Bett ...) wurde
 * von Hand nach vorn gezogen (OVR). Die Tabelle ROWS ist fest eingetragen, damit neue Teile spaeter dazukommen koennen, ohne dass sich
 * bestehende Freischaltungen verschieben; fuer neue Ids gibt es als Ersatz eine Punktzahl aus Preis und Kategorie (CUTS).
 * Ein von Hand gesetztes d.lv (Haustiere, Fan-Poster) hat Vorrang. Das Level selbst kommt aus RS.economy.level() (im Dashboard: das Level aus
 * dem Level-System; Level 7 ~ 650 XP, Level 12 ~ 1900 XP, Level 19 ~ 7700 XP).
 * Muss nach allen Katalog-Dateien und shell.js/styles-more.js geladen werden.
 */
(function (g) {
  'use strict';
  const RS = g.RS;
  const ROWS = `
0: pumpkin lamp_table water_dispenser keyboard_mouse pouf shoe_rack succulents dish_rack art_dream pennant crate_wood bath_mat headphones pegboard fence_picket

15: rug_rainbow neon_love gym_squat_rack desk_pc sofa_plaid bed_double christmas_tree kitchen_tall worldmap corkboard_l sideboard_wood washing_machine foosball piano_digital aquarium

17: rug_shag neon_music bike_trainer palm_kentia stove window_slit window_tall table_dining_6 arcade drum_kit swing
18: rug_persian neon_sign desk_music chesterfield bed_loft ficus_big fridge fridge_big window_wide window_paned hutch_green bathtub jukebox cat_tree
19: fireplace lamp_arc rower desk_l sofa_l bed_canopy lemon_tree kitchen_island window_french window_big bar_counter bathtub_claw pool_table piano_upright tree_small
`;
  // Grundausstattung und Lieblingsstuecke: frueher freischalten als der Preis es nahelegt
  const OVR = {
    sofa_modern: 2, armchair: 4, chair_office: 1, chair_gaming: 6, stool_bar: 3, bed_single: 2, bed_double: 8, wardrobe_wood: 4, dresser_tall: 3, vanity: 7, table_round: 3, table_dining_6: 7,
    desk_wood: 2, desk_pc: 3, coffee_wood: 2, tv_stand: 3, sideboard_wood: 6, bookcase_wood: 4, fridge: 2, stove: 3, counter_sink: 3, kitchen_base: 1, kitchen_upper: 2, kitchen_drawers: 2,
    microwave: 2, coffee_machine: 3, dishwasher: 8, kitchen_tall: 7, hood: 6, fridge_big: 10, kitchen_island: 12, toilet: 1, sink_pedestal: 1, vanity_sink: 4, bathtub: 3, shower: 5,
    washing_machine: 4, mirror_cabinet: 2, towel_rail: 1, bathtub_claw: 12, window_tall: 1, window_wide: 3, window_paned: 4, window_square: 1, window_slit: 3, window_big: 9, window_french: 8,
    lamp_floor: 1, lamp_arc: 8, lamp_tripod: 5, monstera: 3, ficus_big: 6, palm_kentia: 8, tv_wall: 5, tv_crt: 3, rug_plain: 1, rug_round: 3, rug_geo: 8, neon_sign: 6, desk_standing: 8, desk_l: 12,
    desk_music: 10, sofa_3: 7, sofa_plaid: 9, armchair_wing: 8, rug_runner: 4, mirror_round: 4, curtain_white: 2, shelf_float: 2, corkboard_s: 2, lego_table: 5, parts_drawers: 4, ring_light: 3, gym_bench: 3, gym_dumbbells: 3
  };
  const LV = {};
  ROWS.trim().split('\n').forEach((r) => { const m = r.match(/^(\d+):\s*(.*)$/); if (m) m[2].split(' ').forEach((id) => { if (id) LV[id] = +m[1]; }); });
  Object.assign(LV, OVR);

  // Ersatz fuer Ids, die nicht in der Tabelle stehen (neue Teile): Punktzahl aus Preis, Kategorie und fester Streuung
  const MUL = { musik: 1.25, garten: 1.2, sport: 1.1 };
  const CUTS = [2.17, 2.81, 3.16, 3.32, 3.73, 3.91, 4.12, 4.65, 5.51, 6.04, 6.42, 7.17, 8.08, 9.1, 10.11, 11.15, 13.19, 15.19, 18.66];
  const FAN = { poster_starwars: 3, poster_marvel: 5, poster_potter: 7, poster_zelda: 9, poster_stranger: 11, poster_jurassic: 13, poster_witcher: 15 };
  const frac = (id) => ([...id].reduce((a, ch) => (a * 131 + ch.charCodeAt(0)) >>> 0, 7) % 1000) / 1000;
  const score = (d) => d.price * (MUL[d.cat] || 1) + frac(d.id) * 1.2;

  RS.levelFor = function (d) {
    if (d.mine) return 0;
    if (LV[d.id] != null) return LV[d.id];
    const s = score(d);
    return CUTS.filter((x) => s > x).length;
  };
  RS.ITEMS.forEach((d) => { if (FAN[d.id] != null) d.lv = FAN[d.id]; else if (d.lv == null) d.lv = RS.levelFor(d); });

  // Boeden und Waende
  const stLv = (p) => (p <= 0 ? 0 : p <= 4 ? 1 : p <= 5 ? 2 : p <= 6 ? 4 : p <= 7 ? 6 : p <= 8 ? 8 : p <= 9 ? 10 : p <= 10 ? 12 : p <= 12 ? 14 : 16);
  RS.FLOORS.concat(RS.WALLS).forEach((s) => { if (s.lv == null) s.lv = stLv(s.price); });

  // Naechste Freischaltung ueber dem aktuellen Level: { lv, n } (n = Teile, Boeden, Waende)
  RS.nextUnlock = function (lvl) {
    const all = RS.ITEMS.concat(RS.FLOORS, RS.WALLS);
    let best = 99;
    all.forEach((d) => { if ((d.lv || 0) > lvl && d.lv < best) best = d.lv; });
    if (best === 99) return null;
    return { lv: best, n: all.filter((d) => d.lv === best).length };
  };
  RS.unlockedCount = (lvl) => RS.ITEMS.concat(RS.FLOORS, RS.WALLS).filter((d) => (d.lv || 0) <= lvl).length;
})(window);

</script>

/* Raumspiel – Ton: kleine Synthesizer-Effekte und ein ruhiger Lo-Fi-Loop (alles erzeugt, keine Dateien) */
(function (g) {
  'use strict';
  const RS = (g.RS = g.RS || {});
  const A = (RS.audio = { ctx: null, on: true, musicOn: false, vol: 0.7 });
  let master, sfxBus, musBus, noiseBuf, reverb;

  A.init = function () {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }

    const ctx = (A.ctx = new AC());
    master = ctx.createGain(); master.gain.value = A.on ? A.vol : 0; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.5; sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = 0.34; musBus.connect(master);
    // Rauschen
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    reverb = ctx.createConvolver();

    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.008); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, f, q, delay, type, bus) {
    const ctx = A.ctx; if (!ctx || !A.on) return;
    const t = ctx.currentTime + (delay || 0);
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.value = f; fl.Q.value = q || 1;
    const gn = ctx.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }

  const SFX = {
    click() { tone('square', 740, 980, 0.05, 0.13); },
    hover() { tone('square', 1200, 1200, 0.02, 0.03); },
    open() { tone('square', 520, 520, 0.06, 0.1); tone('square', 780, 780, 0.08, 0.1, 0.06); },
    close() { tone('square', 780, 780, 0.06, 0.1); tone('square', 520, 520, 0.08, 0.1, 0.06); },
    pick() { tone('triangle', 330, 520, 0.09, 0.2); },
    place() { tone('sine', 190, 70, 0.16, 0.5); noise(0.09, 0.22, 700, 0.8); },
    rotate() { tone('square', 480, 720, 0.07, 0.12); },
    buy() { tone('square', 988, 988, 0.07, 0.14); tone('square', 1319, 1319, 0.16, 0.14, 0.07); tone('triangle', 1976, 1976, 0.25, 0.1, 0.12); noise(0.12, 0.05, 6000, 2, 0.1, 'highpass'); },
    sell() { tone('square', 1319, 1319, 0.07, 0.12); tone('square', 988, 988, 0.12, 0.12, 0.07); tone('square', 740, 740, 0.16, 0.1, 0.14); },
    error() { tone('sawtooth', 140, 110, 0.12, 0.2); tone('sawtooth', 140, 110, 0.14, 0.2, 0.15); },
    toggle() { tone('square', 300, 200, 0.05, 0.16); noise(0.03, 0.12, 2500, 1); },
    lamp() { noise(0.025, 0.2, 3500, 1.5); tone('square', 260, 140, 0.05, 0.1); },
    meow() { tone('triangle', 620, 880, 0.12, 0.22); tone('triangle', 880, 560, 0.26, 0.2, 0.1); },

    flush() { noise(0.7, 0.18, 800, 0.5); },
    dumbbell() { tone('square', 200, 150, 0.06, 0.2); noise(0.08, 0.12, 400, 1, 0.02); },
    levelup() { [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.12, 0.13, i * 0.08)); tone('triangle', 1568, 1568, 0.4, 0.12, 0.34); },

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function schedule() {
    const ctx = A.ctx, bpm = 74, sixteenth = 60 / bpm / 4;
    while (nextT < ctx.currentTime + 0.4) {
      const bar = Math.floor(step / 16) % 4, s16 = step % 16, t = nextT + (s16 % 2 ? sixteenth * 0.18 : 0);
      if (s16 === 0) CH[bar].forEach((m, i) => epiano(mtof(m + (i === 0 ? -12 : 0)), t + i * 0.012, 3.2, i === 0 ? 0.2 : 0.085));
      if (s16 === 8 && Math.random() < 0.7) { const c = CH[bar]; [1, 3].forEach((i) => epiano(mtof(c[i] + 12), t + 0.02, 1.6, 0.05)); }
      if (s16 === 0 || s16 === 10) drumKick(t);
      if (s16 === 4 || s16 === 12) drumNoise(t, 0.16, 0.22, 1800, 'bandpass');
      if (s16 % 2 === 0) drumNoise(t, 0.04, 0.05 + Math.random() * 0.05, 7000, 'highpass');
      if (s16 === 6 || s16 === 14) if (Math.random() < 0.4) { const c = CH[bar]; epiano(mtof(c[2 + Math.floor(Math.random() * 3)] + 12), t, 0.9, 0.06); }
      if (Math.random() < 0.12) drumNoise(t + Math.random() * sixteenth, 0.012, 0.09, 4000, 'highpass');

    if (!on && timer) { clearInterval(timer); timer = null; }
  };

  };
})(window);

<script>
/* src/def-save.js */
/* Raumspiel – Verteidigung: Spielstand (Held, Material, Fortschritt). Liegt als Feld `def` im Spielstand des Raums (world.def) und wandert so mit
 * in die Cloud; ohne Spiel (Tests) bleibt er im Speicher. Alles rein als Zahlen und Namen, klein (wenige KB).
 */
(function (g) {
  'use strict';
  const RS = (g.RS = g.RS || {});
  const D = (RS.def = RS.def || {});
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const defaults = () => ({ v: 1, lv: 1, xp: 0, mats: { fell: 0, knochen: 0, stein: 0 }, prog: {}, diff: 'normal', paid: 0, endless: {} });
  let mem = null;   // Ersatz ohne Spiel

  // Gespeicherte Daten pruefen und fehlende Felder auffuellen (aeltere oder beschaedigte Staende werden nicht abgelehnt)
  function fix(d) {
    const o = defaults();
    if (!d || typeof d !== 'object') return o;
    o.lv = Math.max(1, Math.min(99, Math.round(num(d.lv, 1)))); o.xp = Math.max(0, Math.round(num(d.xp, 0)));
    for (const k of Object.keys(o.mats)) o.mats[k] = Math.max(0, Math.round(num(d.mats && d.mats[k], 0)));
    if (d.prog && typeof d.prog === 'object') for (const s of D.STAGES) { const p = d.prog[s.id]; if (p && typeof p === 'object') o.prog[s.id] = { stars: Math.max(0, Math.min(3, Math.round(num(p.stars, 0)))), best: Math.max(0, Math.round(num(p.best, 0))) }; }
    if (d.endless && typeof d.endless === 'object') for (const k of Object.keys(d.endless)) o.endless[k] = Math.max(0, Math.round(num(d.endless[k], 0)));
    o.diff = ['easy', 'normal', 'hard'].includes(d.diff) ? d.diff : 'normal';
    o.paid = Math.max(0, Math.round(num(d.paid, 0) * 100) / 100);
    // Ausruestung und Besitz (Etappe 2): unbekannte Felder bleiben erhalten
    for (const k of Object.keys(d)) if (!(k in o)) o[k] = d[k];
    return o;
  }

  // Der Spielstand des Kampfspiels (wird bei Bedarf angelegt)
  D.data = function () {
    const w = RS.G && RS.G.world;
    if (w) { if (!w.def || w.def.v !== 1 || !w.def._ok) { w.def = fix(w.def); Object.defineProperty(w.def, '_ok', { value: true, enumerable: false, configurable: true }); } return w.def; }
    return mem || (mem = fix(null));
  };
  // Aenderung melden: Zeitstempel (neuerer Stand gewinnt), speichern, Stunden-Anzeige im Raum auffrischen
  D.commit = function () {
    const G = RS.G; if (!G || !G.world) return;
    G.world.updatedAt = Date.now();
    if (G.saveSoon) G.saveSoon();
    if (RS.ui && RS.ui.refreshAll) { try { RS.ui.refreshAll(); } catch (e) { /* Anzeige noch nicht bereit */ } }
  };
  D.resetSave = function () { const w = RS.G && RS.G.world; if (w) w.def = null; mem = null; return D.data(); };

  /* ---------- Held-Level ---------- */
  D.heroCap = () => D.LV.cap(RS.economy && RS.economy.level ? RS.economy.level() : 0);
  D.heroStats = function (lv) {
    lv = Math.max(1, lv | 0);
    return { lv, hp: D.HERO.hp + D.LV.hpPer * (lv - 1), dmg: 1 + D.LV.dmgPer * (lv - 1) };
  };
  // Erfahrung gutschreiben; Rueckgabe: neue Level (bis zur Obergrenze)
  D.addXp = function (save, xp) {
    const cap = D.heroCap(), before = save.lv; save.xp += Math.max(0, Math.round(xp));
    while (save.lv < cap && save.xp >= D.LV.xpNeed(save.lv)) { save.xp -= D.LV.xpNeed(save.lv); save.lv++; }
    if (save.lv >= cap) save.xp = Math.min(save.xp, D.LV.xpNeed(save.lv) - 1);
    return save.lv - before;
  };

  /* ---------- Fortschritt ---------- */
  D.stageOpen = function (save, idx) {
    if (idx <= 0) return true;
    const prev = D.STAGES[idx - 1], p = prev && save.prog[prev.id];
    return !!(p && p.stars >= 1);
  };
  D.stageStars = (save, id) => (save.prog[id] ? save.prog[id].stars : 0);
  D.totalStars = (save) => D.STAGES.reduce((a, s) => a + D.stageStars(save, s.id), 0);
})(window);

  const sfx = (n, a) => { if (D.sfx) D.sfx(n, a); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rng = (seed) => { let s = seed >>> 0; return () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  const R = (a, b) => a + Math.random() * (b - a);   // nur Optik (Teilchen); die Spielzufaelle laufen ueber S.rng
  const GRAV = 260;   // Schwerkraft fuer Wuerfe (Steine, Saeure)

  D.newBattle = function (opts) {
    opts = opts || {};
    const stage = typeof opts.stage === 'string' ? D.stageById(opts.stage) : (opts.stage || D.STAGES[0]);
    const diff = D.DIFF.find((q) => q.id === (opts.diff || 'normal')) || D.DIFF[1];
    const lv = Math.max(1, opts.heroLv | 0), HS = D.heroStats(lv), H = D.HERO;
    const S = {
      stage, diff, heroLv: lv, seed: opts.seed || ((Math.random() * 1e9) | 0), t: 0, phase: 'intro', timer: 1.6, wave: -1, waveT: 0, spawnQ: [], endT: 0,
      hero: { x: 128, band: 1, hp: HS.hp, maxHp: HS.hp, state: 'idle', face: 1, t: 0, walkT: 0, swingT: 0, swingHit: false, throwT: 0, thrown: false, cdMelee: 0, cdSling: 0.4, koT: 0, inv: 0, flash: 0, moving: false, stun: 0, castT: 0, hurtT: 0, stepN: 0 },
      mons: [], proj: [], eproj: [], pools: [], rocks: [], fx: [], texts: [], arcs: [],
      fence: { x: D.FENCE.x, w: D.FENCE.w, hp: D.FENCE.hp, maxHp: D.FENCE.hp, state: 0, flash: 0 },
      house: { x0: D.HOUSE.x0, x1: D.HOUSE.x1, hp: D.HOUSE.hp, maxHp: D.HOUSE.hp, state: 0, flash: 0 },
      ab: { cd: 0, max: H.ability.cd }, in: { tx: null, dir: 0, ab: false },
      shake: 0, hitstop: 0, banner: null, tap: null, uid: 1, stars: 0,
      hpMul: stage.hp * diff.hp, monDmg: stage.dmg, dmgMul: HS.dmg, lootMul: diff.loot, xpMul: diff.xp,
      loot: { fell: 0, knochen: 0, stein: 0 }, xp: 0, boss: null, bossDown: false, bossT: 0, result: null,
      stats: { kills: 0, time: 0, kos: 0, taken: 0, by: {} }

  };

  /* ---------- Hilfen ---------- */
  const footY = (band) => D.GY + D.BANDS[band];
  const fenceFront = (S) => S.fence.x + S.fence.w / 2;
  const addText = (S, x, y, str, col, big) => { S.texts.push({ x: x + R(-7, 7), y: y - R(0, 7), str, col, big: !!big, t: 0, life: big ? 0.95 : 0.75 }); if (S.texts.length > 40) S.texts.shift(); };
  function burst(S, x, y, n, cols, o) {
    o = o || {};
    for (let i = 0; i < n; i++) {
      const a = R(0, Math.PI * 2), sp = R(20, 90) * (o.speed || 1);
      S.fx.push({ x, y, vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp - (o.up == null ? 30 : o.up), g: o.g == null ? 260 : o.g, t: 0, life: R(0.28, 0.6), col: cols[(Math.random() * cols.length) | 0], s: Math.random() < 0.3 ? 2 : 1 });
    }

  }
  D.burst = burst;
  const fenceState = (f) => { const r = f.hp / f.maxHp; return r > 0.66 ? 0 : r > 0.33 ? 1 : r > 0 ? 2 : 3; };
  const alive = (S) => S.mons.some((m) => !m.dead);
  const isBossWave = (S, w) => S.stage.waves[w].some((e) => D.MON[e.type].boss);

  /* ---------- Wellen ---------- */
  function startWave(S) {
    S.wave++;
    S.phase = 'wave'; S.waveT = 0;
    S.spawnQ = S.stage.waves[S.wave].map((e) => Object.assign({}, e)).sort((a, b) => a.at - b.at);
    const last = S.wave + 1 === S.stage.waves.length;
    S.banner = { text: isBossWave(S, S.wave) ? 'BOSS-WELLE' : 'WELLE ' + (S.wave + 1), sub: last && !isBossWave(S, S.wave) ? 'Letzte Welle!' : '', t: 0, life: 2 };
    sfx('wave');
  }
  function endWave(S) {
    if (S.wave + 1 >= S.stage.waves.length) { finish(S, true); return; }
    S.phase = 'break'; S.timer = S.stage.pause;
    S.banner = { text: 'Geschafft!', sub: 'Zaun repariert, kurz durchatmen', t: 0, life: 2 };
    // Pause: Held voll geheilt, Zaun um ein Drittel repariert
    S.hero.hp = S.hero.maxHp; S.fence.hp = Math.min(S.fence.maxHp, S.fence.hp + S.fence.maxHp * 0.34); S.fence.state = fenceState(S.fence);
    S.pools.length = 0;
    sfx('waveEnd');
  }
  function finish(S, won) {
    S.phase = won ? 'win' : 'lose'; S.endT = 0; S.stats.time = S.t;
    const r = S.house.hp / S.house.maxHp;
    S.stars = won ? (r >= 0.9 ? 3 : r >= 0.5 ? 2 : 1) : 0;
    S.banner = { text: won ? 'SIEG!' : 'Das Haus ist gefallen', sub: '', t: 0, life: 99 };
    // Ergebnis: Material gibt es nur beim Sieg, Erfahrung immer (plus Bonus fuers Schaffen)
    S.result = {
      won, stars: S.stars, xp: Math.round(S.xp + (won ? (S.stage.xp || 0) * S.xpMul : 0)),
      loot: won ? Object.assign({}, S.loot) : { fell: 0, knochen: 0, stein: 0 }, lostLoot: won ? null : Object.assign({}, S.loot)
    };
    sfx(won ? 'win' : 'lose');
  }

  /* ---------- Monster erzeugen ---------- */
  function spawn(S, type, opt) {
    opt = opt || {};
    const T = D.MON[type], band = Math.floor(S.rng() * 3);
    const m = {
      id: S.uid++, type, T, x: opt.x != null ? opt.x : D.W + 26 + S.rng() * 14, band, dep: D.BANDS[band],
      hp: T.hp * S.hpMul, maxHp: T.hp * S.hpMul, t: 0, walkT: S.rng() * 2, cd: 0.3 + S.rng() * 0.4, bite: 0, stun: 0, flash: 0, dead: false, deadT: 0, state: 'walk', slow: 0,
      spd: 1, rate: 1, alt: T.fly ? T.alt + S.rng() * 14 - 7 : 0, phase: 0, specT: T.boss ? 5.5 : 0, specGap: 0, act: null, volley: 3, dmg: T.dmg * S.monDmg
    };
    S.mons.push(m);
    if (T.boss) { S.boss = m; S.banner = { text: 'BOSS', sub: T.name, t: 0, life: 2.4 }; sfx('roar'); S.shake = Math.max(S.shake, 3); }
    else if (type === 'rhino') sfx('roar');

  }
  function summon(S, type, n) { for (let i = 0; i < n; i++) spawn(S, type, { x: D.W + 18 + i * 13 }); }

  /* ---------- Schaden ---------- */
  function rollLoot(S, m) {
    for (const e of (m.T.loot || [])) {
      const mat = e[0], c = e[1] * S.lootMul, q = e[2] + Math.floor(S.rng() * (e[3] - e[2] + 1));
      let n = 0;
      if (e[1] >= 1) n = Math.max(1, Math.round(q * S.lootMul)); else if (S.rng() < Math.min(1, c)) n = q;
      if (n > 0) { S.loot[mat] += n; if (D.MATS[mat]) addText(S, m.x, D.GY + m.dep - m.T.h - 12, '+' + n, D.MATS[mat].col, m.T.boss); }
    }
  }
  function damageMon(S, m, dmg, o) {
    o = o || {};
    const T = m.T;
    dmg = Math.max(1, Math.round(dmg));
    m.hp -= dmg; m.flash = 0.12; m.stun = Math.max(m.stun, (o.stun || 0.08) * (T.boss ? 0.2 : 1));
    if (o.kb && !m.act) m.x += o.kb * T.kb;
    const hy = D.GY + m.dep - (m.alt || 0) - T.h;
    addText(S, m.x, hy - 4, String(dmg), o.crit ? '#ffe45a' : '#ffffff', o.crit);
    burst(S, m.x, hy + T.h * 0.5, o.crit ? 9 : 5, ['#fff6c0', '#ffd24a', '#ffffff'], { speed: 0.8 });
    if (m.hp <= 0) {

      burst(S, m.x, hy + T.h * 0.6, T.boss ? 30 : 12, T.fly ? ['#8a6aa8', '#b49ad0', '#6a5090'] : m.type === 'rhino' || T.base === 'rhino' ? ['#8a5a30', '#b8844a', '#6b4222'] : ['#8ed04a', '#d8f28a', '#f08a3a'], { speed: 1.1 });
      sfx('die'); S.shake = Math.max(S.shake, T.hw > 25 ? 3 : 0.8);
      if (T.hw > 25) S.hitstop = Math.max(S.hitstop, 0.08);
      if (T.boss) { S.bossDown = true; S.bossT = 0; S.banner = { text: 'BOSS BESIEGT!', sub: T.name, t: 0, life: 2.6 }; S.shake = 6; S.hitstop = 0.22; sfx('bossDown'); }
    } else {

  function hurtHero(S, dmg, fromX) {
    const h = S.hero;

    h.hp -= dmg; h.flash = 0.18; h.hurtT = 0.3; S.stats.taken += dmg;
    addText(S, h.x, D.GY + D.BANDS[h.band] - 58, '-' + Math.round(dmg), '#ff6b6b');
    sfx('hurt'); S.shake = Math.max(S.shake, 1.6);
    h.x = clamp(h.x + (fromX > h.x ? -3 : 3), 16, D.W - 14);
    if (h.hp <= 0) { h.hp = 0; h.state = 'ko'; h.koT = D.HERO.ko; h.stun = 0; S.stats.kos++; S.in.tx = null; sfx('ko'); burst(S, h.x, D.GY + D.BANDS[h.band] - 20, 10, ['#ffffff', '#ffd24a'], { speed: 0.9 }); }
  }
  function stunHero(S, sec) {
    const h = S.hero; if (h.state === 'ko') return;
    h.stun = Math.max(h.stun, sec); S.in.tx = null; sfx('hurt');

  }
  function hitFence(S, dmg, src) {

    const st = fenceState(f);
    burst(S, f.x + f.w / 2 + 4, D.GY - 20, 4, ['#b8844a', '#8a5a30', '#d8a868'], { speed: 0.7 });
    addText(S, f.x + f.w / 2 + 6, D.GY - 52, String(Math.round(dmg)), '#ffb04a');
    if (st !== f.state) { f.state = st; if (st === 3) { sfx('fenceBreak'); S.shake = Math.max(S.shake, 4); burst(S, f.x, D.GY - 18, 22, ['#b8844a', '#8a5a30', '#d8a868', '#e8c890'], { speed: 1.4 }); } }

  }

  /* ---------- Held ---------- */
  // Nahkampf erreicht Flieger nur, wenn sie tief genug fliegen
  const MELEE_ALT = 52;
  function nearestMon(S, x, maxD) {
    let best = null, bd = maxD == null ? 1e9 : maxD;

    return best;
  }
  function meleeTarget(S) {
    const h = S.hero, C = D.HERO.club;
    for (const m of S.mons) { if (m.dead || m.alt > MELEE_ALT) continue; const d = (m.x - h.x) * h.face; if (d > -10 && d < C.reach + m.T.hw * 0.5) return m; }
    return null;
  }
  function slingTarget(S) {
    const h = S.hero, A = D.HERO.sling; let best = null, bd = 1e9;
    for (const m of S.mons) { if (m.dead) continue; const d = (m.x - h.x) * h.face; if (d > 20 && d < A.range && d < bd) { bd = d; best = m; } }
    return best;
  }
  function meleeHit(S) {
    const h = S.hero, C = D.HERO.club, list = [];
    for (const m of S.mons) { if (m.dead || m.alt > MELEE_ALT) continue; const d = (m.x - h.x) * h.face; if (d > -10 && d < C.reach + m.T.hw * 0.5) list.push([d, m]); }
    list.sort((a, b) => a[0] - b[0]);

    for (const e of list) {

      const crit = S.rng() < C.crit;

    }

  }
  function throwStone(S) {
    const h = S.hero, A = D.HERO.sling, m = slingTarget(S);
    const sx = h.x + h.face * 12, sy = footY(h.band) - 40;
    let vx = A.speed * h.face, vy = -60;
    if (m) {
      const tx = m.x, ty = D.GY + m.dep - (m.alt || 0) - m.T.h * 0.55, dt = Math.max(0.12, Math.abs(tx - sx) / A.speed);
      vx = (tx - sx) / dt; vy = (ty - sy - 0.5 * GRAV * dt * dt) / dt;
    }
    S.proj.push({ x: sx, y: sy, vx, vy, t: 0 });
    sfx('sling');
  }
  function castHail(S) {
    const A = D.HERO.ability, h = S.hero;
    S.ab.cd = A.cd; sfx('hail');
    for (let i = 0; i < A.rocks; i++) {
      const x = clamp(h.x + A.from + (i + S.rng() * 0.8) * (A.spread / A.rocks), 24, D.W - 16);
      S.rocks.push({ x, dep: D.BANDS[Math.floor(S.rng() * 3)], delay: 0.35 + i * 0.12, y: -24, vy: 0, state: 'wait', r: A.radius });
    }
    if (h.state === 'idle') { h.state = 'cast'; h.castT = 0; }
  }

  function updateHero(S, dt) {
    const h = S.hero, I = S.in, HD = D.HERO;
    h.t += dt; if (h.inv > 0) h.inv -= dt; if (h.flash > 0) h.flash -= dt; if (h.hurtT > 0) h.hurtT -= dt;
    if (h.state === 'ko') {
      h.koT -= dt;
      if (h.koT <= 0) { h.state = 'idle'; h.hp = Math.ceil(h.maxHp * 0.5); h.inv = 1.8; sfx('revive'); burst(S, h.x, footY(h.band) - 20, 12, ['#ffffff', '#7be08c', '#ffd24a'], { speed: 0.9 }); }
      return;
    }
    if (h.stun > 0) { h.stun -= dt; h.moving = false; return; }   // benommen (Schrei): keine Bewegung, kein Angriff
    h.cdMelee -= dt; h.cdSling -= dt;
    // Eingabe: Tastatur hat Vorrang, sonst das angetippte Ziel
    let dir = I.dir || 0;
    if (!dir && I.tx != null) { const d = I.tx - h.x; if (Math.abs(d) < 3) I.tx = null; else dir = Math.sign(d); }
    const busy = h.state === 'swing' || h.state === 'throw' || h.state === 'cast';
    h.moving = !!dir;
    if (dir) {
      h.x = clamp(h.x + dir * HD.speed * (busy ? 0.4 : 1) * dt, 16, D.W - 14); h.walkT += dt;

      if (stp !== h.stepN) { h.stepN = stp; if (!busy) burst(S, h.x - h.face * 5, footY(h.band) - 1, 2, ['#d8b87c', '#b08450', '#e8c890'], { speed: 0.3, up: 14, g: 120 }); }
    }
    // Blick: zum naechsten Gegner in der Naehe, sonst in Laufrichtung

      if (h.swingT >= 0.4) h.state = 'idle';
    } else if (h.state === 'cast') {
      h.castT += dt;
      if (h.castT >= 0.5) h.state = 'idle';

    }
  }

  /* ---------- Monster: Ziele und Verhalten ---------- */
  function pickTarget(S, m) {
    const h = S.hero, f = S.fence;
    // vorderstes Hindernis vor dem Monster: Held (wenn er vor dem Zaun steht oder der Zaun gefallen ist), Zaun, Haus
    let best = { kind: 'house', x: S.house.x1 };
    if (f.hp > 0 && m.x > f.x) { const fx = fenceFront(S); if (fx > best.x) best = { kind: 'fence', x: fx }; }
    if (h.state !== 'ko' && h.inv <= 0 && m.x > h.x && (f.hp <= 0 || h.x > fenceFront(S) - 2)) { const hx = h.x + 9; if (hx > best.x) best = { kind: 'hero', x: hx }; }
    return best;
  }
  function hitTarget(S, m, tgt, mul) {
    const dmg = m.dmg * (mul || 1);
    if (tgt.kind === 'hero') hurtHero(S, dmg, m.x);
    else if (tgt.kind === 'fence') hitFence(S, dmg * m.T.struct, m.type);
    else hitHouse(S, dmg * m.T.struct, m.type);
  }
  function queued(S, m) {
    for (const o of S.mons) { if (o === m || o.dead || o.fly || o.band !== m.band || o.x >= m.x || o.T.fly) continue; if (m.x - o.x < (m.T.hw + o.T.hw) * 0.72) return true; }
    return false;
  }
  function walk(S, m, dt) {
    if (queued(S, m)) { m.state = 'wait'; return; }
    m.x -= m.T.speed * m.spd * dt; m.walkT += dt * m.spd; m.state = 'walk';
  }
  function meleeAI(S, m, dt) {
    const tgt = pickTarget(S, m), gap = m.x - tgt.x;
    if (gap <= m.T.reach) {
      m.state = 'attack'; m.cd -= dt;
      if (m.cd <= 0) { m.cd = m.T.rate * m.rate; m.bite = 0.24; hitTarget(S, m, tgt, 1); }
    } else walk(S, m, dt);
  }
  // Spuckechse: bleibt auf Abstand stehen und wirft Saeure im Bogen
  function spit(S, m, tgt, spread) {
    const T = m.T, h = S.hero;
    const sx = m.x - T.hw * 0.55, sy = D.GY + m.dep - T.h * 0.8;
    let tx = tgt.kind === 'hero' ? h.x : tgt.kind === 'fence' ? fenceFront(S) - 2 : S.house.x1 - 8;
    const ty = tgt.kind === 'hero' ? footY(h.band) - 22 : D.GY - 14;
    tx += spread || 0;
    const t2 = clamp(Math.abs(sx - tx) / T.shot.speed, 0.5, 1.7);
    S.eproj.push({ x: sx, y: sy, vx: (tx - sx) / t2, vy: (ty - sy - 0.5 * GRAV * t2 * t2) / t2, t: 0, dmg: T.shot.dmg * S.monDmg, struct: T.struct, big: !!T.boss, pool: false, src: m.type });
    m.bite = 0.3; sfx('spit');
  }
  function rangedAI(S, m, dt) {
    const T = m.T, tgt = pickTarget(S, m), gap = m.x - tgt.x;
    if (gap <= T.range) {
      m.state = 'attack'; m.cd -= dt;
      if (m.cd <= 0) { m.cd = T.rate * m.rate; if (T.boss) { const n = m.volley; for (let i = 0; i < n; i++) spit(S, m, tgt, (i - (n - 1) / 2) * 16); } else spit(S, m, tgt, 0); }
    } else walk(S, m, dt);
  }
  // Flieger: fliegt hoch heran, sinkt vor dem Ziel ab und beisst aus der Luft; Ziel ist das Haus (oder der Held, wenn er nah darunter steht)
  function flyerAI(S, m, dt) {
    const T = m.T, h = S.hero;
    let tx = S.house.x1 + 16, kind = 'house';
    if (h.state !== 'ko' && h.inv <= 0 && m.x > h.x - 8 && m.x - h.x < 40) { tx = h.x + 8; kind = 'hero'; }
    const gap = m.x - tx;
    if (gap <= T.reach) {
      m.alt += (T.atkAlt - m.alt) * Math.min(1, dt * 5);
      m.state = 'attack'; m.cd -= dt;

  function updateFx(S, dt) {
    for (let i = S.fx.length - 1; i >= 0; i--) { const p = S.fx[i]; p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.life) S.fx.splice(i, 1); }

        if (hero.state !== 'ko' && hero.hp < hero.maxHp) bar(ctx, Math.round(hero.x - 11), e.y - 70, 22, hero.hp / hero.maxHp);
        if (hero.state === 'ko') drawText(ctx, String(Math.ceil(hero.koT)), hero.x - hero.face * 6, e.y - 30, '#ffffff', false);
        if (hero.stun > 0) for (let i = 0; i < 3; i++) { const a = tm * 6 + i * 2.1; ctx.fillStyle = '#ffe45a'; ctx.fillRect(Math.round(hero.x + Math.cos(a) * 9), Math.round(e.y - 66 + Math.sin(a) * 2.5), 2, 2); }
      } else {
        const m = e.m, T = m.T, alt = m.alt || 0;
        shadow(ctx, m.x, e.y + 1, T.hw * 0.62 * (1 - Math.min(0.55, alt / 150)));
        let fr = Math.floor(m.walkT * T.fps) % 4;
        if (m.bite > 0) fr = 4; else if (m.state === 'stun') fr = 1; else if (m.state === 'leap') fr = 5;
        const spr = D.monSprite(m.type, fr);
        if (m.dead) {
          const k = Math.min(1, m.deadT / 0.45);
          const s = spr.flip(), dx = Math.round(m.x - s.ox), dh = Math.max(1, Math.round(s.h * (1 - k * 0.85)));
          ctx.globalAlpha = 1 - k * k;
          ctx.drawImage(m.deadT < 0.1 ? s.tint('white', '#ffffff') : s.cv, 0, 0, s.w, s.h, dx, Math.round(e.y - alt * (1 - k) - dh + (s.h - s.oy)), s.w, dh);
          ctx.globalAlpha = 1;
        } else {
          drawSpr(ctx, spr, m.x, e.y - alt, true, m.flash > 0 ? ['white', 'rgba(255,255,255,0.7)'] : null);
          if (!T.boss && (m.hp < m.maxHp || m.type === 'rhino')) bar(ctx, Math.round(m.x - 10), e.y - alt - T.h - 11, 20, m.hp / m.maxHp);
        }
      }
    }

    // Geschosse
    for (const p of S.proj) { const st = D.stoneSprite(2); ctx.drawImage(st.cv, Math.round(p.x - st.ox), Math.round(p.y - st.oy + st.h / 2)); }
    // Saeure der Spuckechsen
    for (const p of S.eproj) {
      const r = p.big ? 3 : 2;
      for (let i = 3; i >= 1; i--) { ctx.globalAlpha = 0.18 * (4 - i); ctx.fillStyle = '#8ed04a'; ctx.fillRect(Math.round(p.x - p.vx * 0.016 * i * 2) - 1, Math.round(p.y - p.vy * 0.016 * i * 2) - 1, 2, 2); }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#2f6a24'; ctx.fillRect(Math.round(p.x) - r - 1, Math.round(p.y) - r, r * 2 + 3, r * 2 + 1); ctx.fillRect(Math.round(p.x) - r, Math.round(p.y) - r - 1, r * 2 + 1, r * 2 + 3);
      ctx.fillStyle = '#6ac040'; ctx.fillRect(Math.round(p.x) - r, Math.round(p.y) - r, r * 2 + 1, r * 2 + 1);
      ctx.fillStyle = '#d8f28a'; ctx.fillRect(Math.round(p.x) - r + 1, Math.round(p.y) - r + 1, 2, 2);
    }
    // Steinhagel: fallende Steine
    for (const r of S.rocks) if (r.state === 'fall') { const st = D.stoneSprite(5); ctx.drawImage(st.cv, Math.round(r.x - st.ox), Math.round(r.y - st.oy + st.h / 2)); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(Math.round(r.x - 1), Math.round(r.y - 22), 2, 14); }
    // Hieb-Bogen: Halbmond aus hellen Pixeln, wird schnell blasser
    for (const a of S.arcs) {
      const k = a.t / 0.16;
      for (let i = 0; i < 13; i++) {
        const an = -1.45 + i * 0.2, R1 = 30 - k * 3, R2 = R1 - 5 + Math.abs(i - 6) * 0.5;
        const px = a.x + a.face * Math.cos(an) * R1 * 0.9, py = a.y - Math.sin(an) * R1 + 10, qx = a.x + a.face * Math.cos(an) * R2 * 0.9, qy = a.y - Math.sin(an) * R2 + 10;
        ctx.fillStyle = 'rgba(255,255,255,' + (0.95 * (1 - k)).toFixed(2) + ')'; ctx.fillRect(Math.round(px), Math.round(py), 2, 2);
        ctx.fillStyle = 'rgba(255,236,160,' + (0.6 * (1 - k)).toFixed(2) + ')'; ctx.fillRect(Math.round(qx), Math.round(qy), 2, 2);
      }
    }
    // Teilchen
    for (const p of S.fx) { ctx.globalAlpha = Math.max(0, 1 - (p.t / p.life) * (p.t / p.life)); ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
    ctx.globalAlpha = 1;
    // Tipp-Markierung
    if (S.tap) { const k = S.tap.t / 0.5, r = 3 + k * 9; ctx.fillStyle = 'rgba(255,255,255,' + (0.8 * (1 - k)).toFixed(2) + ')'; for (let a = 0; a < 14; a++) { const an = a / 14 * Math.PI * 2; ctx.fillRect(Math.round(S.tap.x + Math.cos(an) * r), Math.round(GY + 14 + Math.sin(an) * r * 0.35), 1, 1); } }
    // Zahlen
    for (const t of S.texts) drawText(ctx, t.str, t.x, Math.round(t.y), t.col, t.big, Math.min(1, (t.life - t.t) / 0.25));
    ctx.restore();
    world.front(ctx, S, tm);
  };
})(window);

</script>

<script>
/* src/def-hub.js */
/* Raumspiel – Verteidigung: Auswahl vor dem Kampf (Stufen mit Sternen, Schwierigkeit, Held mit Level und Material) und Ergebnis nach dem Kampf.
 * Liest und schreibt den Spielstand ueber D.data()/D.commit() (def-save.js). Die Oberflaeche (Fenster, Schleife) steckt in def-ui.js.
 */
(function (g) {
  'use strict';
  const RS = (g.RS = g.RS || {});
  const D = (RS.def = RS.def || {});
  const $ = (id) => document.getElementById(id);
  const H = (D.hub = { sel: 0, diff: 'normal', ready: true });
  const fmt = (n) => (Math.round(n * 10) / 10).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const matHtml = (m, n) => '<span class="hmat"><i style="background:' + D.MATS[m].col + '"></i>' + D.MATS[m].name + ' <b>' + n + '</b></span>';
  const stars = (n, big) => [0, 1, 2].map((i) => '<img class="pxi ' + (big ? 'big ' : '') + '" alt="" draggable="false" src="' + D.icon(i < n ? 'star' : 'star0') + '">').join('');

  // Stunden zum Ausgeben (gemeinsamer Topf mit dem Raum)
  H.balance = function () { try { return RS.G && RS.G.balance ? RS.G.balance() : 0; } catch (e) { return 0; } };

  H.html = function () {
    return '<div id="dhub" class="dui">' +
      '<div class="hhead"><div class="dtitle num">VERTEIDIGUNG</div><div class="hchips"><span class="chip" id="hLv"></span><span class="chip gold" id="hHours"></span></div></div>' +
      '<div class="hmain">' +
        '<div class="hhero panel p2"><canvas id="hHeroCv" width="76" height="76"></canvas><div class="hname num" id="hName"></div>' +
          '<div class="hxp"><div class="dbar"><i id="hXp"></i></div></div><div class="hxpt" id="hXpT"></div><div class="hxpt hstat" id="hStat"></div><div class="hmats" id="hMats"></div></div>' +
        '<div class="hstages" id="hStages"></div>' +
      '</div>' +
      '<div class="hfoot"><div class="hdiff" id="hDiff"></div><div class="acts"><button class="btn" id="hBack">Zurück zum Raum</button><button class="btn sm rotbtn" id="dRotM">Bild drehen</button><button class="btn gold big" id="hGo">Kampf starten</button></div></div>' +
      '</div>';
  };

  H.bind = function () {
    $('hBack').onclick = () => D.close();
    $('hGo').onclick = () => { if (RS.audio) RS.audio.init(); if (H.canStart()) D.start({ stage: H.sel, diff: H.diff }); };
    $('hStages').addEventListener('click', (e) => { const b = e.target.closest('.hst'); if (!b || b.classList.contains('lock')) return; H.select(+b.dataset.i); });
    $('hDiff').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; H.diff = b.dataset.d; const s = D.data(); s.diff = H.diff; D.commit(); H.refresh(); });
  };

  H.canStart = () => D.ready && H.ready && D.stageOpen(D.data(), H.sel);

  // Stufe waehlen und ihre Monster (vor allem die grossen Bosse) im Hintergrund vorbereiten
  H.select = function (i) {
    H.sel = Math.max(0, Math.min(D.STAGES.length - 1, i)); H.refresh();
    const types = {}; D.STAGES[H.sel].waves.forEach((w) => w.forEach((e) => (types[e.type] = 1)));
    const jobs = []; Object.keys(types).forEach((t) => { const n = t === 'saber' ? 6 : 5; for (let f = 0; f < n; f++) jobs.push(() => D.monSprite(t, f)); });
    H.ready = false; setGo();
    let k = 0; clearTimeout(H.timer);
    const run = () => { const t0 = performance.now(); while (k < jobs.length && performance.now() - t0 < 14) jobs[k++](); if (k < jobs.length) H.timer = setTimeout(run, 0); else { H.ready = true; setGo(); } };
    if (RS.G && RS.G.manual) { jobs.forEach((j) => j()); H.ready = true; setGo(); } else H.timer = setTimeout(run, 30);
  };
  function setGo() {
    const b = $('hGo'); if (!b) return;
    const open = D.stageOpen(D.data(), H.sel), ok = D.ready && H.ready && open;
    b.disabled = !ok; b.textContent = !open ? 'Gesperrt' : ok ? 'Kampf starten' : 'Lade …';
  }

  H.refresh = function () {
    const s = D.data(), cap = D.heroCap(), need = D.LV.xpNeed(s.lv);
    H.diff = s.diff || H.diff;
    $('hLv').textContent = 'Held Lv ' + s.lv + (s.lv >= cap ? ' (max.)' : '');
    $('hHours').textContent = fmt(H.balance()) + ' h';
    $('hName').textContent = 'LV ' + s.lv;
    const pr = s.lv >= cap ? 1 : s.xp / need; $('hXp').style.width = Math.round(pr * 100) + '%';
    $('hXpT').textContent = s.lv >= cap ? 'Obergrenze erreicht (2 × Dashboard-Level)' : s.xp + ' / ' + need + ' EP';
    const hst = D.heroStats(s.lv); $('hStat').textContent = 'LP ' + hst.hp + ' · Schaden +' + Math.round((hst.dmg - 1) * 100) + ' %';
    $('hMats').innerHTML = Object.keys(D.MATS).map((m) => matHtml(m, s.mats[m])).join('');
    $('hStages').innerHTML = D.STAGES.map((st, i) => {
      const open = D.stageOpen(s, i), n = D.stageStars(s, st.id);
      return '<button class="hst' + (i === H.sel ? ' sel' : '') + (open ? '' : ' lock') + '" data-i="' + i + '"><span class="hn num">' + (i + 1) + '</span><span class="hnm">' + st.name + '</span>' +
        '<span class="hsr">' + (open ? stars(n, false) : '<em>gesperrt</em>') + '</span></button>';
    }).join('');
    $('hDiff').innerHTML = D.DIFF.map((q) => '<button data-d="' + q.id + '" class="' + (q.id === H.diff ? 'on' : '') + '">' + q.name + '</button>').join('');
    setGo();
  };

  H.show = function () {
    const s = D.data();
    // vorgewaehlt: die erste noch nicht geschaffte freie Stufe, sonst die letzte
    let i = 0; for (let k = 0; k < D.STAGES.length; k++) { if (D.stageOpen(s, k)) { i = k; if (D.stageStars(s, D.STAGES[k].id) < 1) break; } }
    if (H.sel > i || !D.stageOpen(s, H.sel)) H.sel = i;
    $('dhub').classList.add('show'); H.select(H.sel); H.drawHero(0);
  };
  H.hide = function () { const e = $('dhub'); if (e) e.classList.remove('show'); clearTimeout(H.timer); };

  // Held-Vorschau (leicht atmend)
  H.drawHero = function (tm) {
    const cv = $('hHeroCv'); if (!cv || !D.ready) return;
    const f = Math.floor(tm * 5) % 4, spr = D.heroSprite(D.look, 'stand', f), x = cv.getContext('2d');
    x.clearRect(0, 0, cv.width, cv.height); x.imageSmoothingEnabled = false;
    x.drawImage(spr.cv, Math.round(cv.width / 2 - spr.ox), Math.round(cv.height - 4 - spr.oy));
  };

  /* ---------- Ergebnis nach dem Kampf: in den Spielstand uebernehmen und als Text zurueckgeben ---------- */
  H.applyResult = function (S) {
    const s = D.data(), R = S.result, st = S.stage, info = { lines: [], levelUp: 0, unlocked: null, newStars: 0 };
    if (!R) return info;
    const before = D.stageStars(s, st.id), wasOpen = D.STAGES.map((q, i) => D.stageOpen(s, i));
    info.levelUp = D.addXp(s, R.xp);
    for (const m of Object.keys(R.loot)) s.mats[m] += R.loot[m];
    if (R.won) { const p = s.prog[st.id] || (s.prog[st.id] = { stars: 0, best: 0 }); p.stars = Math.max(p.stars, R.stars); info.newStars = Math.max(0, R.stars - before); }
    const now = D.STAGES.findIndex((q, i) => !wasOpen[i] && D.stageOpen(s, i)); if (now >= 0) info.unlocked = D.STAGES[now].name;
    D.commit();
    return info;
  };
  H.endHtml = function (S, info) {
    const R = S.result, m = Math.floor(S.stats.time / 60), sec = Math.floor(S.stats.time % 60), s = D.data();
    let h = (R.won ? '' : 'Das Haus ist gefallen. Diesmal keine Beute.<br>') + 'Monster besiegt: <b>' + S.stats.kills + '</b> · Haus: <b>' + Math.round(S.house.hp / S.house.maxHp * 100) + ' %</b> · Zeit: <b>' + m + ':' + (sec < 10 ? '0' : '') + sec + '</b>';
    if (S.stats.kos) h += ' · Held ausgeschaltet: <b>' + S.stats.kos + '×</b>';
    if (R.won) { const parts = Object.keys(R.loot).filter((k) => R.loot[k] > 0).map((k) => matHtml(k, '+' + R.loot[k])); h += '<div class="hloot">' + (parts.length ? parts.join('') : 'keine Beute') + '</div>'; }
    h += '<div class="hxpl"><b>+' + R.xp + ' EP</b>' + (info.levelUp ? ' · <span class="up">HELD LEVEL ' + s.lv + '!</span>' : '') + '</div>';
    if (info.unlocked) h += '<div class="hxpl"><span class="up">Neue Stufe: ' + info.unlocked + '</span></div>';
    return h;
  };
  H.stars = stars;
})(window);

</script>

  // Querformat anfordern (beim Oeffnen, innerhalb des Antippens): erst direkt (installierte Verknuepfung/App), sonst im Vollbild (Browser-Tab auf dem Handy)

<script>
/* src/ui.js */
/* Raumspiel – Oberflaeche: Anzeige, Schublade, Katalog, Werkzeugleiste, Meldungen */
(function (g) {

  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  const TODS = [{ m: 'auto', n: 'Auto (echte Uhrzeit)', icon: 'sun' }, { m: 8, n: 'Morgen', icon: 'sun' }, { m: 12.5, n: 'Mittag', icon: 'sun' }, { m: 19, n: 'Abend', icon: 'sun' }, { m: 23, n: 'Nacht', icon: 'moon' }];

  /* ---------- Meldungen ---------- */
  UI.toast = function (html, cls) {

    $('toasts').appendChild(t);

  };

  /* ---------- Anzeige oben ---------- */
  let shown = null;
  UI.refreshHours = function () {
    const b = G.balance();
    const v = $('hv');
    if (shown === null) { shown = b; v.textContent = fmt(b); }
    else if (Math.abs(b - shown) > 0.001) {
      const from = shown, to = b, t0 = performance.now();
      shown = b;
      const tick = (now) => { const k = Math.min(1, (now - t0) / 450); v.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); };

<script>
/* src/bridge.js */
/* Raumspiel – Anbindung ans Dashboard (nur aktiv, wenn die Seite als iframe mit ?embed=1 im Dashboard laeuft).
 * Das Dashboard ist die einzige Quelle fuer Stunden (seit 1. Oktober) und Level und der einzige, der in die Cloud schreibt.
 *   Spiel -> Dashboard: hello (bereit), save {state, spent, next, thumb}, close, flushed, orient {mode: 'landscape' | 'portrait'}
 *   Dashboard -> Spiel: init {economy, state}, economy {economy} (Stunden/Level aktualisieren), flush (jetzt speichern)
 * Nachrichten werden nur von der eigenen Herkunft und nur vom Eltern-Fenster angenommen. Ohne Dashboard spielt das Spiel normal weiter
 * (Demo-Stunden, Speicherstand im Browser).
 */
(function (g) {
  'use strict';
  const RS = (g.RS = g.RS || {});
  const B = (RS.bridge = { embedded: false, economy: null, state: null });
  B.embedded = g.parent !== g && /[?&]embed=1/.test(location.search);
  const post = (msg) => { try { g.parent.postMessage(Object.assign({ src: 'raumspiel' }, msg), location.origin); } catch (e) { /* ignore */ } };
  let onInit = null;

  function useEconomy(eco) {
    B.economy = eco;
    const E = RS.economy;
    if (!E) return;
    E.demo = false; E.since = (eco && eco.since) || '1. Oktober'; E.rank = (eco && eco.rank) || '';
    E.earned = () => (B.economy ? B.economy.earned : 0);
    E.level = () => (B.economy ? B.economy.level : 0);
    E.setEarned = () => {}; E.setLevel = () => {};
  }

  g.addEventListener('message', (e) => {
    const d = e.data;
    if (!B.embedded || e.origin !== location.origin || e.source !== g.parent || !d || d.src !== 'dashboard') return;
    if (d.type === 'init') { B.state = d.state || null; useEconomy(d.economy); if (onInit) onInit(d); }
    else if (d.type === 'economy') { useEconomy(d.economy); if (RS.ui && RS.ui.refreshAll) RS.ui.refreshAll(); }
    else if (d.type === 'flush') { if (RS.G && RS.G.save) RS.G.save(); post({ type: 'flushed' }); }
  });

  // Handshake: wartet bis zu 4 Sekunden auf das Dashboard, sonst normal weiter (z.B. wenn die Seite von Hand mit ?embed=1 geoeffnet wurde)
  B.hello = () => new Promise((resolve) => {
    if (!B.embedded) { resolve(null); return; }
    const t = setTimeout(() => { B.embedded = false; resolve(null); }, 4000);
    onInit = (d) => { clearTimeout(t); resolve(d); };
    post({ type: 'hello' });
  });
  B.save = (state, meta) => post(Object.assign({ type: 'save', state }, meta || {}));
  B.close = () => post({ type: 'close' });
  B.orient = (mode) => post({ type: 'orient', mode });   // 'landscape' | 'portrait': das Dashboard sperrt die Ausrichtung bzw. dreht das Bild
})(window);

</script>
<script>
/* src/game.js */
/* Raumspiel – Spielkern: Ansicht, Schleife, Eingaben, Platzieren, Kaufen */
(function (g) {
  'use strict';
  const RS = (g.RS = g.RS || {});
  const $ = (id) => document.getElementById(id);
  const G = (RS.G = RS.G || {});
  const GRID = 8;
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } } };
  RS.store = store;

  /* ---------- Wirtschaft (Adapter: spaeter echte Stunden aus dem Dashboard) ---------- */
  RS.economy = {
    demo: true,
    earned() { const v = parseFloat(store.get('raumspiel.hours')); return isFinite(v) ? v : 320; },
    setEarned(v) { store.set('raumspiel.hours', String(v)); },
    level() { const v = parseInt(store.get('raumspiel.level'), 10); return isFinite(v) ? v : 6; },
    setLevel(v) { store.set('raumspiel.level', String(v)); }

  const world = (G.world = new RS.World());

  G.sel = null;              // gewaehlte Instanz
  G.hover = null;            // Instanz unter dem Zeiger
  G.ghost = null;            // {d, rot, v, x, y, z, ok, fromInv?, group?: [...]}
  G.time = 0;
  G.settings = { sound: true, music: false, todMode: 'auto', hourSet: 20, zoom: 0 };
  G.tod = { hour: 20, target: 20 };
  const cv = $('cv'), ctx = cv.getContext('2d');
  const base = document.createElement('canvas'), bctx = base.getContext('2d');
  let dpr = 1, devScale = 3, cssScale = 3, cw = 0, ch = 0;
  let pan = { x: 0, y: 0, tx: 0, ty: 0 };
  let ptr = { x: -1, y: -1, down: false, id: null, moved: 0, sx: 0, sy: 0, mode: null, item: null };
  let lastLight = 0, needFull = true, particles = [];
  const keys = {};
  G._ptr = ptr;

  /* ---------- Ansicht ---------- */
  function roomExtent() {
    const bb = world.plan.bbox(), T = RS.SHELL.T, S = RS.SHELL.S, TL = 32;
    if (!bb) return { w: 240, h: 220, cx: 0, cy: 0 };
    const x0 = bb.c0 * TL - (bb.r1 + 1) * TL - T, x1 = (bb.c1 + 1) * TL - bb.r0 * TL;
    const y0 = (bb.c0 * TL + bb.r0 * TL) / 2 - RS.WALLH, y1 = ((bb.c1 + 1) * TL + (bb.r1 + 1) * TL) / 2 + S;
    return { w: x1 - x0 + 24, h: y1 - y0 + 30, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
  }
  G.layout = function () {
    dpr = g.devicePixelRatio || 1;
    const vw = Math.max(360, g.innerWidth || 0), vh = Math.max(300, g.innerHeight || 0);
    const ex = roomExtent();
    const drawerPx = G.mode === 'build' ? vh * 0.34 : 0;
    const availW = vw * dpr, availH = (vh - drawerPx - 8) * dpr;
    let s = Math.floor(Math.min(availW / ex.w, availH / ex.h) + 0.3);
    s = Math.max(1, s + G.settings.zoom);
    s = Math.max(1, Math.min(8, s));
    devScale = s; cssScale = devScale / dpr;

    const h = G.toolHover; if (!h) return;
    const key = [h.kind, h.c, h.r, h.si, h.run ? h.run.axis + h.run.line : ''].join('|');
    if (!first && key === ptr.toolKey) return;
    ptr.toolKey = key;
    const done = (msg, sfx) => { G.shellPending = true; RS.audio.sfx(sfx || 'click'); if (msg) RS.ui.toast(msg); RS.ui.refreshAll(); G.saveSoon(); };
    if (T.type === 'floor') {
      const t = pl.get(h.c, h.r); if (!t) return;
      if (!G.ownStyle('floor', T.style)) return;
      const list = T.fill ? pl.roomTiles(t.r) : [[h.c, h.r]];
      let n = 0; list.forEach(([c, r]) => { if (pl.setFloor(c, r, T.style)) n++; });
      if (n) done(null, 'place');
    } else if (T.type === 'wall') {
      if (!G.ownStyle('wall', T.style)) return;
      const run = h.run; let n = 0;
      for (let i = T.fill ? run.i0 : h.si; i <= (T.fill ? run.i1 : h.si); i++) { const ax = run.axis; if (pl.setWall(ax, ax === 'W' ? run.line : i, ax === 'W' ? i : run.line, T.style)) n++; }
      if (n) done(null, 'place');
    } else if (T.type === 'door') {
      const sg = segOf(h), run = h.run, a0 = h.si * 32 + RS.PLAN.DOOR[0], a1 = h.si * 32 + RS.PLAN.DOOR[1];
      const e = pl.edge(sg.ax, sg.c, sg.r);
      if (!(e && e.o)) {
        const blocked = world.items.some((it) => {
          if (it.d.place !== 'wall') return false;
          const dm = dimsOf(it.d, it.rot), ax = it.rot === 0 ? 'N' : 'W', pp = it.rot === 0 ? it.y + (it.d.inset || 0) : it.x + (it.d.inset || 0), u = it.rot === 0 ? it.x : it.y, len = it.rot === 0 ? dm.w : dm.d;
          return ax === run.axis && pp === run.p && u < a1 && u + len > a0;
        });
        if (blocked) { RS.audio.sfx('error'); RS.ui.toast('Dort hängt noch etwas an der Wand', 'r'); return; }
      }
      const on = pl.toggleOpening(sg.ax, sg.c, sg.r);
      done(on ? 'Durchgang geöffnet' : 'Durchgang geschlossen', 'open');
    } else if (T.type === 'tile+') {
      if (!h.ok) { if (first) { RS.audio.sfx('error'); RS.ui.toast('Dort kann nichts angebaut werden', 'r'); } return; }
      const cost = RS.PLAN.TILE_PRICE;
      if (G.balance() < cost) { RS.audio.sfx('error'); RS.ui.toast('Zu wenig Stunden: noch <span class="g">' + fmt(cost - G.balance()) + ' h</span>', 'r'); return; }
      const nb = pl.neighbors(h.c, h.r).map((n) => pl.get(n[0], n[1])).filter(Boolean).sort((x, y) => x.r - y.r)[0];
      pl.addTile(h.c, h.r, nb.r, nb.f, cost);
      G.layout(); done('Feld angebaut <span class="g">−' + fmt(cost) + ' h</span>', 'buy');
    } else if (T.type === 'tile-') {
      if (!h.ok) return;
      const x0 = h.c * 32, y0 = h.r * 32;
      if (world.items.some((it) => { if (it.d.place === 'wall') return false; const dm = dimsOf(it.d, it.rot); return it.x < x0 + 32 && x0 < it.x + dm.w && it.y < y0 + 32 && y0 < it.y + dm.d; })) { RS.audio.sfx('error'); RS.ui.toast('Dort steht noch etwas', 'r'); return; }
      const keep = pl.get(h.c, h.r), save = JSON.stringify(pl.toJSON());
      if (!pl.removeTile(h.c, h.r)) { RS.audio.sfx('error'); RS.ui.toast('Das letzte Feld bleibt', 'r'); return; }
      const bad = world.items.some((it) => { if (it.d.place !== 'wall') return false; const dm = dimsOf(it.d, it.rot); return !world.plan.wallFit(it.d.inset || 0, it.rot, it.x, it.y, it.z, dm.w, dm.d, dm.h); });
      if (bad) { world.plan = RS.Plan.fromJSON(JSON.parse(save)); RS.audio.sfx('error'); RS.ui.toast('An der Wand hängt noch etwas', 'r'); G.refreshShell(); return; }
      G.layout(); done('Feld entfernt <span class="g">+' + fmt(keep.p || 0) + ' h</span>', 'sell');
    } else if (T.type === 'room') {
      if (!h.ok) { RS.audio.sfx('error'); RS.ui.toast('Dort passt der Raum nicht: er muss an den Grundriss grenzen', 'r'); return; }
      const cost = G.roomCost(T.rw, T.rh);
      if (G.balance() < cost) { RS.audio.sfx('error'); RS.ui.toast('Zu wenig Stunden: noch <span class="g">' + fmt(cost - G.balance()) + ' h</span>', 'r'); return; }
      pl.addRoom(h.c0, h.r0, T.rw, T.rh, pl.def.floor, Math.round(cost / (T.rw * T.rh) * 100) / 100);
      G.setTool(null); G.layout(); done('Raum angebaut: <b>' + T.rw + '×' + T.rh + '</b> <span class="g">−' + fmt(cost) + ' h</span>', 'buy');
    }
  };

  // Vorschau der Werkzeuge im Bild
  function quad(pts, fill, line) {
    ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill();
    ctx.fillStyle = line; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; pxLine(a[0], a[1], b[0], b[1]); }
  }
  G.drawToolOverlay = function () {
    const T = G.tool, h = G.toolHover; if (!T || !h) return;
    const ok = h.ok !== false, fill = ok ? 'rgba(255,220,120,0.30)' : 'rgba(255,90,90,0.30)', line = ok ? 'rgba(255,236,160,0.95)' : 'rgba(255,110,110,0.95)';
    if (h.kind === 'tile') {
      const x0 = h.c * 32, y0 = h.r * 32;
      quad([[x0, y0], [x0 + 32, y0], [x0 + 32, y0 + 32], [x0, y0 + 32]].map((q) => scene.toScreen(q[0], q[1], 0)), fill, line);
    } else if (h.kind === 'rect') {
      const x0 = h.c0 * 32, y0 = h.r0 * 32, x1 = x0 + h.w * 32, y1 = y0 + h.h * 32;
      quad([[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map((q) => scene.toScreen(q[0], q[1], 0)), fill, line);
    } else if (h.kind === 'seg') {
      const run = h.run, a0 = h.si * 32, a1 = a0 + 32, H = run.H;
      const P = run.axis === 'N' ? (u, z) => scene.toScreen(u, run.p, z) : (u, z) => scene.toScreen(run.p, u, z);
      quad([P(a0, 0), P(a1, 0), P(a1, H), P(a0, H)], fill, line);
    }
  };

  /* ---------- Start ---------- */
  G.boot = async function () {
    const bar = $('bootbar'), tip = $('boottip');
    const tips = ['Tipp: Mit R drehst du Möbel.', 'Tipp: Kleine Dinge lassen sich auf Tische und Regale stellen.', 'Tipp: Schränke gehen auf, wenn du ein kleines Teil darüber hältst – dann stellst du es direkt ins Fach.', 'Tipp: Unter „Fürs Regal“ findest du Kleinkram für Regale und Schränke.', 'Tipp: Ziehe mit der Maus, um die Ansicht zu verschieben.', 'Tipp: Mit dem Mausrad zoomst du.', 'Tipp: Klick auf Lampen und Fernseher schaltet sie an.'];
    tip.textContent = tips[Math.floor(Math.random() * tips.length)];
    RS.installIcons();
    if (RS.bridge) await RS.bridge.hello();   // im Dashboard: Stunden, Level und Spielstand abholen
    const loaded = G.load();
    if (!loaded) {
      world.plan = RS.Plan.initial();
      world.styles = { floor: { oak: 0 }, wall: { panel: 0 } };
      G.starter();
    }
    // Sprites vorrechnen (fuer die Karten und den Raum)
    const list = RS.ITEMS.filter((d) => d.mine);   // nur die Teile aus Kilians Zimmer vorab, der Rest entsteht beim ersten Anschauen
    for (let i = 0; i < list.length; i++) {
      try { RS.spriteFor(list[i], 0, 0, 0); } catch (e) { console.error('Sprite', list[i].id, e); }
      if (i % 4 === 0) { bar.style.width = Math.round((i / list.length) * 80) + '%'; await new Promise((r) => setTimeout(r, 0)); }
    }
    bar.style.width = '88%'; await new Promise((r) => setTimeout(r, 0));
    G.tod.hour = G.targetHour(); G.todK = -1;
    G.layout();
    scene.setShell(world.plan, world.cutouts());
    world.items.forEach((it) => scene.addItem(it));
    RS.avatar.init(G, world, scene);
    if (RS.pets) RS.pets.init(G, world, scene);
    scene.compose(); scene.syncLights();
    RS.ui.init();
    bar.style.width = '100%';
    if (G.settings.music && RS.audio) { /* Musik startet nach der ersten Eingabe */ }
    setTimeout(() => $('boot').classList.add('done'), 250);
    setTimeout(() => { $('boot').style.display = 'none'; }, 900);
    requestAnimationFrame(frame);
  };
  G.starter = function () {
    const give = (id, x, y, rot, v) => { const d = RS.ITEM[id]; if (d) world.items.push(world.makeInst(d, { x, y, z: 0, rot: rot || 0, v: v || 0, p: 0 })); };
    const o = RS.PLAN.START[0] * 32;
    give('window_basement', o + 112, o - 8, 0, 0); world.items[world.items.length - 1].z = 58;
    give('radiator', o + 112, o, 0, 0); world.items[world.items.length - 1].z = 3;
    give('daybed', o + 4, o + 4, 0, 0);
    give('coffee_white', o + 90, o + 60, 0, 0);
  };
  // Beim Verlassen/Verstecken sofort speichern (wichtig im Dashboard, dort liegt der Stand in der Cloud)
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.save) G.save(); });
  g.addEventListener('pagehide', () => { if (G.save) G.save(); });
  g.addEventListener('load', () => G.boot());
})(window);

</script>
