<script>
/* src/levels.js */
/* Raumspiel – Freischaltung nach Level: Alles Neue wird mit hoeheren Leveln verfuegbar und dann mit Stunden gekauft.
 * Teile aus Kilians Zimmer (mine) sind von Anfang an frei. Der Rest wird nach Preis und Kategorie gestaffelt (Level 0..30).
 * Ein von Hand gesetztes d.lv hat Vorrang. Das Level selbst kommt aus RS.economy.level() (spaeter das Dashboard-Level).
 * Muss nach allen Katalog-Dateien und shell.js geladen werden.
 */
(function (g) {
  'use strict';
  const RS = g.RS;
  const TIERS = [[1.5, 0], [3, 1], [4.5, 2], [6, 3], [8, 5], [10, 7], [12, 9], [15, 11], [19, 14], [25, 17], [1e9, 21]];
  const CATADD = { sport: 1, bad: 1, medien: 1, musik: 3, garten: 4 };
  const FAN = { poster_starwars: 3, poster_marvel: 5, poster_potter: 7, poster_zelda: 9, poster_stranger: 11, poster_jurassic: 13, poster_witcher: 15 };
  const jit = (id) => ([...id].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7) % 3) - 1;

  RS.levelFor = function (d) {
    if (d.mine) return 0;
    let lv = 0;
    for (const t of TIERS) if (d.price <= t[0]) { lv = t[1]; break; }
    if (lv > 0) lv = Math.max(1, lv + (CATADD[d.cat] || 0) + jit(d.id));
    return Math.min(30, lv);
  };
  RS.ITEMS.forEach((d) => { if (FAN[d.id] != null) d.lv = FAN[d.id]; else if (d.lv == null) d.lv = RS.levelFor(d); });

  // Boeden und Waende
  const stLv = (p) => (p <= 0 ? 0 : p <= 5 ? 1 : p <= 6 ? 2 : p <= 7 ? 3 : p <= 8 ? 5 : p <= 9 ? 6 : p <= 10 ? 8 : 10);
  RS.FLOORS.concat(RS.WALLS).forEach((s) => { if (s.lv == null) s.lv = stLv(s.price); });

  // Naechste Freischaltung ueber dem aktuellen Level: { lv, n } (n = Teile, Boeden, Waende)
  RS.nextUnlock = function (lvl) {
    const all = RS.ITEMS.concat(RS.FLOORS, RS.WALLS);
    let best = 99;
    all.forEach((d) => { if ((d.lv || 0) > lvl && d.lv < best) best = d.lv; });
    if (best === 99) return null;
    return { lv: best, n: all.filter((d) => d.lv === best).length };
  };
  RS.unlockedCount = (lvl) => RS.ITEMS.concat(RS.FLOORS, RS.WALLS).filter((d) => (d.lv || 0) <= lvl).length;
})(window);

</script>

<script>
/* src/audio.js */
/* Raumspiel – Ton: kleine Synthesizer-Effekte und ein ruhiger Lo-Fi-Loop (alles erzeugt, keine Dateien) */
(function (g) {
  'use strict';
  const RS = (g.RS = g.RS || {});
  const A = (RS.audio = { ctx: null, on: true, musicOn: false, vol: 0.7 });
  let master, sfxBus, musBus, noiseBuf, reverb;

  A.init = function () {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
    const AC = g.AudioContext || g.webkitAudioContext;
    if (!AC) return;
    const ctx = (A.ctx = new AC());
    master = ctx.createGain(); master.gain.value = A.on ? A.vol : 0; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.5; sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = 0.34; musBus.connect(master);
    // Rauschen
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // kleiner Hall
    reverb = ctx.createConvolver();
    const len = ctx.sampleRate * 1.6, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    reverb.buffer = ir;
    const rg = ctx.createGain(); rg.gain.value = 0.35; reverb.connect(rg); rg.connect(musBus);
  };
  A.setOn = function (on) { A.on = on; if (master) master.gain.setTargetAtTime(on ? A.vol : 0, A.ctx.currentTime, 0.05); };
  A.setVol = function (v) { A.vol = v; if (master && A.on) master.gain.setTargetAtTime(v, A.ctx.currentTime, 0.05); };

  function tone(type, f0, f1, dur, vol, delay, bus) {
    const ctx = A.ctx; if (!ctx || !A.on) return;
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.008); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, f, q, delay, type, bus) {
    const ctx = A.ctx; if (!ctx || !A.on) return;
    const t = ctx.currentTime + (delay || 0);
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.value = f; fl.Q.value = q || 1;
    const gn = ctx.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(gn); gn.connect(bus || sfxBus); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  const SFX = {
    click() { tone('square', 740, 980, 0.05, 0.13); },
    hover() { tone('square', 1200, 1200, 0.02, 0.03); },
    open() { tone('square', 520, 520, 0.06, 0.1); tone('square', 780, 780, 0.08, 0.1, 0.06); },
    close() { tone('square', 780, 780, 0.06, 0.1); tone('square', 520, 520, 0.08, 0.1, 0.06); },
    pick() { tone('triangle', 330, 520, 0.09, 0.2); },
    place() { tone('sine', 190, 70, 0.16, 0.5); noise(0.09, 0.22, 700, 0.8); },
    rotate() { tone('square', 480, 720, 0.07, 0.12); },
    buy() { tone('square', 988, 988, 0.07, 0.14); tone('square', 1319, 1319, 0.16, 0.14, 0.07); tone('triangle', 1976, 1976, 0.25, 0.1, 0.12); noise(0.12, 0.05, 6000, 2, 0.1, 'highpass'); },
    sell() { tone('square', 1319, 1319, 0.07, 0.12); tone('square', 988, 988, 0.12, 0.12, 0.07); tone('square', 740, 740, 0.16, 0.1, 0.14); },
    error() { tone('sawtooth', 140, 110, 0.12, 0.2); tone('sawtooth', 140, 110, 0.14, 0.2, 0.15); },
    toggle() { tone('square', 300, 200, 0.05, 0.16); noise(0.03, 0.12, 2500, 1); },
    lamp() { noise(0.025, 0.2, 3500, 1.5); tone('square', 260, 140, 0.05, 0.1); },
    meow() { tone('triangle', 620, 880, 0.12, 0.22); tone('triangle', 880, 560, 0.26, 0.2, 0.1); },
    bark() { tone('square', 300, 160, 0.09, 0.16); tone('square', 280, 140, 0.11, 0.16, 0.16); },
    squeak() { tone('sine', 1500, 2100, 0.07, 0.1); tone('sine', 1900, 1400, 0.07, 0.08, 0.09); },
    quack() { tone('sawtooth', 520, 380, 0.09, 0.14); tone('sawtooth', 500, 340, 0.1, 0.12, 0.13); },
    purr() { for (let i = 0; i < 6; i++) tone('sawtooth', 70, 62, 0.07, 0.07, i * 0.09); },
    step() { noise(0.04, 0.05, 500, 1); },
    flush() { noise(0.7, 0.18, 800, 0.5); },
    dumbbell() { tone('square', 200, 150, 0.06, 0.2); noise(0.08, 0.12, 400, 1, 0.02); },
    levelup() { [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.12, 0.13, i * 0.08)); tone('triangle', 1568, 1568, 0.4, 0.12, 0.34); },
    wow() { tone('triangle', 400, 1200, 0.3, 0.2); }
  };
  A.sfx = function (name) { try { if (A.ctx && SFX[name]) SFX[name](); } catch (e) { /* ignore */ } };

  /* ---------- Lo-Fi-Loop ---------- */
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const CH = [[50, 57, 60, 64, 67], [43, 55, 59, 62, 65], [48, 55, 59, 62, 64], [45, 55, 58, 61, 64]];
  let timer = null, nextT = 0, step = 0, rainNode = null;
  function epiano(f, t, dur, vol) {
    const ctx = A.ctx;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), gn = ctx.createGain(), fl = ctx.createBiquadFilter();
    o1.type = 'triangle'; o2.type = 'sine'; o1.frequency.value = f; o2.frequency.value = f * 2.003;
    fl.type = 'lowpass'; fl.frequency.value = 1700;
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.012); gn.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.25); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o1.connect(fl); const g2 = ctx.createGain(); g2.gain.value = 0.18; o2.connect(g2); g2.connect(fl); fl.connect(gn); gn.connect(musBus); gn.connect(reverb);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  function drumKick(t) { const ctx = A.ctx, o = ctx.createOscillator(), gn = ctx.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); gn.gain.setValueAtTime(0.5, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.connect(gn); gn.connect(musBus); o.start(t); o.stop(t + 0.25); }
  function drumNoise(t, dur, vol, f, type) { const ctx = A.ctx, s = ctx.createBufferSource(); s.buffer = noiseBuf; const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = 0.8; const gn = ctx.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur); s.connect(fl); fl.connect(gn); gn.connect(musBus); s.start(t, Math.random()); s.stop(t + dur + 0.02); }
  function schedule() {
    const ctx = A.ctx, bpm = 74, sixteenth = 60 / bpm / 4;
    while (nextT < ctx.currentTime + 0.4) {
      const bar = Math.floor(step / 16) % 4, s16 = step % 16, t = nextT + (s16 % 2 ? sixteenth * 0.18 : 0);
      if (s16 === 0) CH[bar].forEach((m, i) => epiano(mtof(m + (i === 0 ? -12 : 0)), t + i * 0.012, 3.2, i === 0 ? 0.2 : 0.085));
      if (s16 === 8 && Math.random() < 0.7) { const c = CH[bar]; [1, 3].forEach((i) => epiano(mtof(c[i] + 12), t + 0.02, 1.6, 0.05)); }
      if (s16 === 0 || s16 === 10) drumKick(t);
      if (s16 === 4 || s16 === 12) drumNoise(t, 0.16, 0.22, 1800, 'bandpass');
      if (s16 % 2 === 0) drumNoise(t, 0.04, 0.05 + Math.random() * 0.05, 7000, 'highpass');
      if (s16 === 6 || s16 === 14) if (Math.random() < 0.4) { const c = CH[bar]; epiano(mtof(c[2 + Math.floor(Math.random() * 3)] + 12), t, 0.9, 0.06); }
      if (Math.random() < 0.12) drumNoise(t + Math.random() * sixteenth, 0.012, 0.09, 4000, 'highpass');
      nextT += sixteenth; step++;
    }
  }
  A.music = function (on) {
    A.musicOn = on;
    if (!A.ctx) return;
    if (on && !timer) { nextT = A.ctx.currentTime + 0.1; step = 0; musBus.gain.setTargetAtTime(0.34, A.ctx.currentTime, 0.1); timer = setInterval(schedule, 120); }
    if (!on && timer) { clearInterval(timer); timer = null; }
  };
  A.rain = function (on) {
    if (!A.ctx) return;
    if (on && !rainNode) {
      const ctx = A.ctx, s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const fl = ctx.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 3200; fl.Q.value = 0.4;
      const gn = ctx.createGain(); gn.gain.value = 0.06; s.connect(fl); fl.connect(gn); gn.connect(musBus); s.start();
      rainNode = { s, gn };
    } else if (!on && rainNode) { rainNode.s.stop(); rainNode = null; }
  };
})(window);

<script>
/* src/ui.js */
/* Raumspiel – Oberflaeche: Anzeige, Schublade, Katalog, Werkzeugleiste, Meldungen */
(function (g) {
  'use strict';
  const RS = (g.RS = g.RS || {});
  const G = (RS.G = RS.G || {});
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => RS.fmt(n);
  const UI = (RS.ui = { tab: 'shop', cat: 'mine', focus: null, vi: 0 });
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  const TODS = [{ m: 'auto', n: 'Auto (echte Uhrzeit)', icon: 'sun' }, { m: 8, n: 'Morgen', icon: 'sun' }, { m: 12.5, n: 'Mittag', icon: 'sun' }, { m: 19, n: 'Abend', icon: 'sun' }, { m: 23, n: 'Nacht', icon: 'moon' }];

  /* ---------- Meldungen ---------- */
  UI.toast = function (html, cls) {
    const t = el('div', 'toast panel p2', html);
    $('toasts').appendChild(t);
    while ($('toasts').children.length > 4) $('toasts').firstChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, 2300);
  };
  let hintT = null;
  UI.setHint = function (txt) {
    const h = $('hint'); clearTimeout(hintT);
    if (!txt) { h.classList.remove('show'); return; }
    h.textContent = txt; h.classList.add('show');
  };

  /* ---------- Anzeige oben ---------- */
  let shown = null;
  UI.refreshHours = function () {
    const b = G.balance();
    const v = $('hv');
    if (shown === null) { shown = b; v.textContent = fmt(b); }
    else if (Math.abs(b - shown) > 0.001) {
      const from = shown, to = b, t0 = performance.now();
      shown = b;
      const tick = (now) => { const k = Math.min(1, (now - t0) / 450); v.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }
    $('hs').innerHTML = 'verbaut <b>' + fmt(G.world.spent()) + ' h</b>' + ' · Lv ' + RS.economy.level() + (RS.economy.demo ? ' · Demo' : '');
    { const nu = RS.nextUnlock ? RS.nextUnlock(RS.economy.level()) : null; $('hours').title = (RS.economy.since ? 'Seit ' + RS.economy.since + ' verdient ' : 'Verdient ') + fmt(RS.economy.earned()) + ' h, verbaut ' + fmt(G.world.spent()) + ' h · Level ' + RS.economy.level() + (nu ? ', nächste Freischaltung bei Level ' + nu.lv + ': ' + nu.n + ' neue Teile' : ''); }
  };
  UI.refreshAll = function () {
    UI.refreshHours(); UI.renderTabs(); UI.renderBody(); UI.selectionChanged();
  };

  /* ---------- Hover-Name ---------- */
  UI.hoverName = function (it, e) {
    const n = $('name');
    if (!it || G.ghost) { n.style.display = 'none'; return; }
    let txt = '<b>' + it.d.name + '</b>';
    if (G.mode === 'play' && G.useful(it)) txt += ' <span class="lbl">· Klick</span>';
    n.innerHTML = txt; n.style.display = 'block';
    n.style.left = Math.min(g.innerWidth - n.offsetWidth - 8, e.clientX + 14) + 'px'; n.style.top = (e.clientY + 18) + 'px';
  };

  /* ---------- Werkzeugleiste an der Auswahl ---------- */
  UI.hideTool = function () { $('tool').style.display = 'none'; };
  UI.selectionChanged = function () {
    const t = $('tool'), it = G.sel;
    if (!it || G.ghost || G.mode !== 'build') { t.style.display = 'none'; return; }
    const d = it.d;
    const hasV = d.variants.length > 1;
    t.innerHTML = '';
    const nm = el('span', 't', '<b>' + d.name + '</b>' + (hasV ? ' · ' + d.variants[it.v].n : '')); t.appendChild(nm);
    const mk = (icon, label, fn, cls) => { const b = el('button', 'btn sm ' + (cls || ''), RS.iconHTML(icon) + '<span>' + label + '</span>'); b.onclick = (e) => { e.stopPropagation(); fn(); }; t.appendChild(b); return b; };
    if (d.place !== 'wall') mk('rotate', 'Drehen', () => G.rotate());
    if (hasV) mk('sparkle', 'Farbe', () => G.cycleVariant(it, 1));
    mk('box', 'Lager', () => G.store(it));
    mk('sell', 'Verkaufen ' + fmt(it.p || 0) + ' h', () => G.sell(it), 'red');
    mk('close', '', () => G.select(null)).classList.add('ico');
    t.style.display = 'block';
    placeTool();
  };
  function placeTool() {
    const it = G.sel, t = $('tool'); if (!it || t.style.display === 'none') return;
    const sp = it.sprite, sc = G.scene;
    const X0 = it.x - (it.par ? 1 : 0), dx = X0 - it.y + sc.camX - sp.ox, dy = ((X0 + it.y) >> 1) - it.z + sc.camY - sp.oy;
    const p = G.toClient(dx + sp.w / 2, dy);
    const w = t.offsetWidth, h = t.offsetHeight;
    let x = p.x - w / 2, y = p.y - h - 14;
    if (y < 8) { const q = G.toClient(0, dy + sp.h); y = q.y + 14; }
    x = Math.max(8, Math.min(g.innerWidth - w - 8, x)); y = Math.max(8, Math.min(g.innerHeight - h - 8, y));
    t.style.left = x + 'px'; t.style.top = y + 'px';

<script>
/* src/bridge.js */
/* Raumspiel – Anbindung ans Dashboard (nur aktiv, wenn die Seite als iframe mit ?embed=1 im Dashboard laeuft).
 * Das Dashboard ist die einzige Quelle fuer Stunden (seit 1. Oktober) und Level und der einzige, der in die Cloud schreibt.
 *   Spiel -> Dashboard: hello (bereit), save {state, spent, next, thumb}, close, flushed
 *   Dashboard -> Spiel: init {economy, state}, economy {economy} (Stunden/Level aktualisieren), flush (jetzt speichern)
 * Nachrichten werden nur von der eigenen Herkunft und nur vom Eltern-Fenster angenommen. Ohne Dashboard spielt das Spiel normal weiter
 * (Demo-Stunden, Speicherstand im Browser).
 */
(function (g) {
  'use strict';
  const RS = (g.RS = g.RS || {});
  const B = (RS.bridge = { embedded: false, economy: null, state: null });
  B.embedded = g.parent !== g && /[?&]embed=1/.test(location.search);
  const post = (msg) => { try { g.parent.postMessage(Object.assign({ src: 'raumspiel' }, msg), location.origin); } catch (e) { /* ignore */ } };
  let onInit = null;

  function useEconomy(eco) {
    B.economy = eco;
    const E = RS.economy;
    if (!E) return;
    E.demo = false; E.since = (eco && eco.since) || '1. Oktober'; E.rank = (eco && eco.rank) || '';
    E.earned = () => (B.economy ? B.economy.earned : 0);
    E.level = () => (B.economy ? B.economy.level : 0);
    E.setEarned = () => {}; E.setLevel = () => {};
  }

  g.addEventListener('message', (e) => {
    const d = e.data;
    if (!B.embedded || e.origin !== location.origin || e.source !== g.parent || !d || d.src !== 'dashboard') return;
    if (d.type === 'init') { B.state = d.state || null; useEconomy(d.economy); if (onInit) onInit(d); }
    else if (d.type === 'economy') { useEconomy(d.economy); if (RS.ui && RS.ui.refreshAll) RS.ui.refreshAll(); }
    else if (d.type === 'flush') { if (RS.G && RS.G.save) RS.G.save(); post({ type: 'flushed' }); }
  });

  // Handshake: wartet bis zu 4 Sekunden auf das Dashboard, sonst normal weiter (z.B. wenn die Seite von Hand mit ?embed=1 geoeffnet wurde)
  B.hello = () => new Promise((resolve) => {
    if (!B.embedded) { resolve(null); return; }
    const t = setTimeout(() => { B.embedded = false; resolve(null); }, 4000);
    onInit = (d) => { clearTimeout(t); resolve(d); };
    post({ type: 'hello' });
  });
  B.save = (state, meta) => post(Object.assign({ type: 'save', state }, meta || {}));
  B.close = () => post({ type: 'close' });
})(window);

</script>
<script>
/* src/game.js */
/* Raumspiel – Spielkern: Ansicht, Schleife, Eingaben, Platzieren, Kaufen */
(function (g) {
  'use strict';
  const RS = (g.RS = g.RS || {});
  const $ = (id) => document.getElementById(id);
  const G = (RS.G = RS.G || {});
  const GRID = 8;
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } } };
  RS.store = store;

  /* ---------- Wirtschaft (Adapter: spaeter echte Stunden aus dem Dashboard) ---------- */
  RS.economy = {
    demo: true,
    earned() { const v = parseFloat(store.get('raumspiel.hours')); return isFinite(v) ? v : 320; },
    setEarned(v) { store.set('raumspiel.hours', String(v)); },
    level() { const v = parseInt(store.get('raumspiel.level'), 10); return isFinite(v) ? v : 6; },
    setLevel(v) { store.set('raumspiel.level', String(v)); }
  };
  const fmt = (n) => (Math.round(n * 10) / 10).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  RS.fmt = fmt;

  /* ---------- Zustand ---------- */
  const scene = (G.scene = new RS.Scene());
  const world = (G.world = new RS.World());
  G.mode = 'play';           // 'play' | 'build'
  G.sel = null;              // gewaehlte Instanz
  G.hover = null;            // Instanz unter dem Zeiger
  G.ghost = null;            // {d, rot, v, x, y, z, ok, fromInv?, group?: [...]}
  G.time = 0;
  G.settings = { sound: true, music: false, todMode: 'auto', hourSet: 20, zoom: 0 };
  G.tod = { hour: 20, target: 20 };
  const cv = $('cv'), ctx = cv.getContext('2d');
  const base = document.createElement('canvas'), bctx = base.getContext('2d');
  let dpr = 1, devScale = 3, cssScale = 3, cw = 0, ch = 0;
  let pan = { x: 0, y: 0, tx: 0, ty: 0 };
  let ptr = { x: -1, y: -1, down: false, id: null, moved: 0, sx: 0, sy: 0, mode: null, item: null };
  let lastLight = 0, needFull = true, particles = [];
  const keys = {};
  G._ptr = ptr;

  /* ---------- Ansicht ---------- */
  function roomExtent() {
    const bb = world.plan.bbox(), T = RS.SHELL.T, S = RS.SHELL.S, TL = 32;
    if (!bb) return { w: 240, h: 220, cx: 0, cy: 0 };
    const x0 = bb.c0 * TL - (bb.r1 + 1) * TL - T, x1 = (bb.c1 + 1) * TL - bb.r0 * TL;
    const y0 = (bb.c0 * TL + bb.r0 * TL) / 2 - RS.WALLH, y1 = ((bb.c1 + 1) * TL + (bb.r1 + 1) * TL) / 2 + S;
    return { w: x1 - x0 + 24, h: y1 - y0 + 30, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
  }
  G.layout = function () {
    dpr = g.devicePixelRatio || 1;
    const vw = Math.max(360, g.innerWidth || 0), vh = Math.max(300, g.innerHeight || 0);
    const ex = roomExtent();
    const drawerPx = G.mode === 'build' ? vh * 0.34 : 0;
    const availW = vw * dpr, availH = (vh - drawerPx - 8) * dpr;
    let s = Math.floor(Math.min(availW / ex.w, availH / ex.h) + 0.3);
    s = Math.max(1, s + G.settings.zoom);
    s = Math.max(1, Math.min(8, s));
    devScale = s; cssScale = devScale / dpr;
    cw = Math.ceil(vw * dpr / devScale); ch = Math.ceil(vh * dpr / devScale);
    cv.width = cw; cv.height = ch; base.width = cw; base.height = ch;
    cv.style.width = (cw * cssScale) + 'px'; cv.style.height = (ch * cssScale) + 'px';
    ctx.imageSmoothingEnabled = false;
    const uu = Math.max(2.5, Math.min(5, Math.round(vw / 420 * 2) / 2));
    document.documentElement.style.setProperty('--u', uu + 'px');
    scene.resize(cw, ch);
    G.placeCamera(true);
    scene.compose(); scene.syncLights();
    needFull = true;
  };
  G.placeCamera = function (snap) {
    const ex = roomExtent();
    const upShift = G.mode === 'build' ? Math.round((Math.max(300, g.innerHeight || 0) * 0.34 / cssScale) / 2) : 0;
    const tx = Math.round(cw / 2 - ex.cx + pan.tx), ty = Math.round(ch / 2 - ex.cy + pan.ty - upShift);
    if (snap) { pan.x = pan.tx; pan.y = pan.ty; }
    scene.setCamera(tx, ty);
  };

  /* ---------- Ansicht in Welt: Zeigerposition ---------- */
  function pointerPx(e) {
    const r = cv.getBoundingClientRect();
    return { x: Math.floor((e.clientX - r.left) / cssScale), y: Math.floor((e.clientY - r.top) / cssScale) };
  }
  G.toClient = function (px, py) { const r = cv.getBoundingClientRect(); return { x: r.left + px * cssScale, y: r.top + py * cssScale }; };

  /* ---------- Hilfen fuer Platzierung ---------- */
  const snap = (v, s) => Math.round(v / s) * s;
  function dimsOf(d, rot) { return RS.dims(d, rot); }

  // Wandlauf unter dem Zeiger (naechste sichtbare Flaeche)
  G.wallPick = function (px, py) {
    const sx = px + 0.5 - scene.camX, sy = py + 0.5 - scene.camY;
    let best = null;
    for (const run of world.plan.runs()) {
      let along, z;
      if (run.axis === 'N') { along = sx + run.p; z = (along + run.p) / 2 - sy; } else { along = run.p - sx; z = (run.p + along) / 2 - sy; }
      if (along < run.u0 || along > run.u1 || z < 0 || z > run.H) continue;
      if (!best || z > best.z) best = { run, along, z };
    }
    return best;
  };

  // Geisterposition fuer Zeiger (px,py). Liefert Ziel (x,y,z,rot) oder null
  G.aimAt = function (d, rot, px, py, ign) {
    const W = world.W, D = world.D;
    if (d.place === 'wall') {
      const w = G.wallPick(px, py);
      if (!w) return null;
      const r = w.run.axis === 'N' ? 0 : 1, dm = dimsOf(d, r), alen = r === 0 ? dm.w : dm.d, inset = d.inset || 0;
      let a = snap(w.along - alen / 2, 4), z = snap(w.z - dm.h / 2, 2);
      a = Math.max(w.run.u0, Math.min(w.run.u1 - alen, a));
      z = Math.max(0, Math.min(w.run.H - dm.h, z));
      if (d.floorWall) z = d.floorWall;
      return r === 0 ? { x: a, y: w.run.p - inset, z, rot: 0 } : { x: w.run.p - inset, y: a, z, rot: 1 };
    }
    const dm = dimsOf(d, rot);
    let z = 0;
    const pk = scene.pickAt(px, py);
    if (d.place === 'surface' && pk && pk.id && pk.n === 0) {
      const o = scene.byId.get(pk.id);
      if (o && !o.d.flat && !(ign && ign.has(o.uid))) z = Math.round(pk.z);
    }
    const [X, Y] = scene.toWorldPlane(px + 0.5, py + 0.5, z);

    if (!loaded) {
      world.plan = RS.Plan.initial();
      world.styles = { floor: { oak: 0 }, wall: { panel: 0 } };
      G.starter();
    }
    // Sprites vorrechnen (fuer die Karten und den Raum)
    const list = RS.ITEMS.filter((d) => d.mine);   // nur die Teile aus Kilians Zimmer vorab, der Rest entsteht beim ersten Anschauen
    for (let i = 0; i < list.length; i++) {
      try { RS.spriteFor(list[i], 0, 0, 0); } catch (e) { console.error('Sprite', list[i].id, e); }
      if (i % 4 === 0) { bar.style.width = Math.round((i / list.length) * 80) + '%'; await new Promise((r) => setTimeout(r, 0)); }
    }
    bar.style.width = '88%'; await new Promise((r) => setTimeout(r, 0));
    G.tod.hour = G.targetHour(); G.todK = -1;
    G.layout();
    scene.setShell(world.plan, world.cutouts());
    world.items.forEach((it) => scene.addItem(it));
    RS.avatar.init(G, world, scene);
    if (RS.pets) RS.pets.init(G, world, scene);
    scene.compose(); scene.syncLights();
    RS.ui.init();
    bar.style.width = '100%';
    if (G.settings.music && RS.audio) { /* Musik startet nach der ersten Eingabe */ }
    setTimeout(() => $('boot').classList.add('done'), 250);
    setTimeout(() => { $('boot').style.display = 'none'; }, 900);
    requestAnimationFrame(frame);
  };
  G.starter = function () {
    const give = (id, x, y, rot, v) => { const d = RS.ITEM[id]; if (d) world.items.push(world.makeInst(d, { x, y, z: 0, rot: rot || 0, v: v || 0, p: 0 })); };
    const o = RS.PLAN.START[0] * 32;
    give('window_basement', o + 112, o - 8, 0, 0); world.items[world.items.length - 1].z = 58;
    give('radiator', o + 112, o, 0, 0); world.items[world.items.length - 1].z = 3;
    give('daybed', o + 4, o + 4, 0, 0);
    give('coffee_white', o + 90, o + 60, 0, 0);
  };
  // Beim Verlassen/Verstecken sofort speichern (wichtig im Dashboard, dort liegt der Stand in der Cloud)
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.save) G.save(); });
  g.addEventListener('pagehide', () => { if (G.save) G.save(); });
  g.addEventListener('load', () => G.boot());
})(window);

</script>
</body>
</html>
