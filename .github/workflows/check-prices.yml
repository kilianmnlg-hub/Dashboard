# Regelmäßige Kontrolle des Preis-Checks (Shop-Radar): alle 2 Stunden und auf Knopfdruck ("JETZT PRÜFEN" im Dashboard) wird das Bricklink-Inventar abgerufen (EIN Aufruf) und die Liste
# gegen den Bestand gehalten: Lots, deren Preis du inzwischen geändert hast (in Bricklink oder über das Dashboard), und verkaufte oder gelöschte Lots wandern in die Liste "Erledigt".
# Dabei wird weiter nach Lots gesucht, die geändert werden müssen: Neu eingestellte Lots werden gleich geprüft, und ein Durchlauf prüft zusätzlich die nächsten Lots der Reihe nach
# (im Zeitplan 60 je Lauf, auf Knopfdruck 150; höchstens 1.200 am Tag), so wächst die Liste nach dem Abarbeiten von selbst nach (SYNC_ONLY=prices in scripts/sync-all.mjs, Regeln in scripts/lib/pricecheck.mjs).
# Schreibt data.js (im privaten Repo) bei einer Änderung, sonst höchstens alle 4 Stunden den Zeitstempel "liveAt" (damit das Dashboard sieht, dass die Kontrolle läuft); auf Knopfdruck immer.
# Kostet je Lauf einen API-Aufruf plus die Preisabfragen für neue Lots und den Durchlauf (Tageslimit der Bricklink-API: 5.000; der Tages-Sync braucht rund 1.500).
# GitHub startet geplante Läufe manchmal mit einigen Minuten Verspätung. Braucht dieselben Secrets wie der Sync (BRICKLINK_*, PRIVATE_DATA_TOKEN).
# Manuell anstoßen: Tab "Actions" -> "Check prices" -> "Run workflow", oder im Dashboard mit dem Knopf "JETZT PRÜFEN" im Preis-Check (der gibt eine Kennung mit, damit er seinen Lauf wiederfindet).
name: Check prices

# Die Kennung im Titel des Laufs: so findet das Dashboard seinen Lauf wieder (bei geplanten Läufen bleibt sie leer)
run-name: Check prices ${{ inputs.tag }}

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Kennung (vom Dashboard)"
        required: false
        default: ""
        type: string

# Nie gleichzeitig mit dem Sync (beide schreiben data.js; der Sync läuft bis zu einer Viertelstunde, ein Zusammentreffen würde sein Speichern stören). Die Gruppe ist dieselbe wie beim Sync.
concurrency:
  group: sync-all
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    # Fehlt das Secret PRIVATE_DATA_TOKEN (z.B. nach dem Neuanlegen des Repos), wird der Lauf mit einer Warnung übersprungen,
    # statt jedes Mal mit einer Fehlermail zu scheitern. Ein abgelaufener oder falscher Token scheitert weiterhin laut.
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.chk.outputs.ok }}
    steps:
      - id: chk
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DATA_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret PRIVATE_DATA_TOKEN fehlt, Lauf uebersprungen (Settings > Secrets and variables > Actions)"
          fi
  check:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Die Daten liegen im PRIVATEN Repo (dashboard-privat), nicht hier. Der Zugriff kommt aus dem Secret PRIVATE_DATA_TOKEN
      # (fine-grained Token, nur dieses eine Repo, Contents: Read and write). Die Skripte arbeiten dort ueber DATA_DIR.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dashboard-privat
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Preis-Check kontrollieren und ggf. speichern
        env:
          SYNC_ONLY: prices
          DATA_DIR: private
          # Auf Knopfdruck (und von Hand) mehr Lots je Lauf und immer speichern, im Zeitplan weniger
          BRICKLINK_PRICE_SWEEP_RUN: ${{ github.event_name == 'workflow_dispatch' && '150' || '60' }}
          BRICKLINK_PRICE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN_VALUE: ${{ secrets.BRICKLINK_TOKEN_VALUE }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
        run: |
          git -C private config user.name "dashboard-bot"
          git -C private config user.email "actions@users.noreply.github.com"
          n=0
          until [ $n -ge 4 ]; do
            node scripts/sync-all.mjs
            git -C private add data.js
            if git -C private diff --quiet --cached; then
              echo "Nichts zu speichern."
              exit 0
            fi
            git -C private commit -q -m "Preis-Check aufgefrischt"
            # Push abgelehnt: zeitgleich hat jemand anderes in dieses Repo geschrieben. Meist war es eine ANDERE Datei (z.B. ein Preis-Auftrag aus dem Dashboard, die oft kurz hintereinander
            # kommen): dann genügt ein schnelles Rebase, die Daten dieses Laufs bleiben gültig. Das Neurechnen unten dauert eine halbe Minute und verliert bei vielen Aufträgen das Rennen.
            for k in 1 2 3 4 5 6; do
              if git -C private push -q; then exit 0; fi
              if ! git -C private pull -q --rebase origin main; then
                git -C private rebase --abort 2>/dev/null || true
                break
              fi
            done
            # Nur wenn data.js selbst von jemand anderem geändert wurde (Konflikt beim Rebase, z.B. durch den stündlichen Schnellcheck auf neue Videos): mit dem neuesten Stand neu rechnen
            n=$((n+1))
            echo "Push fehlgeschlagen (Versuch $n/4), rechne mit dem neuesten Stand neu ..."
            git -C private fetch -q origin main
            git -C private reset -q --hard origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 4 Versuchen weiterhin fehlgeschlagen."
          exit 1
