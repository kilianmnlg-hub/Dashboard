# EINMALIGE Pruefung, ob der Bricklink-Zugang den Rabatt eines Lots (sale_rate) aendern darf (siehe scripts/bricklink-sale-test.mjs): liest ein Lot, schreibt denselben Rabatt zurueck
# und prueft, ob sich dabei etwas aendert. Nur von Hand startbar. Das Protokoll dieses oeffentlichen Repos enthaelt nur Statuscodes und Feldnamen, keine Preise oder Artikel.
name: Bricklink sale test

on:
  workflow_dispatch:
    inputs:
      inventory_id:
        description: "Lot-Nummer (inventory_id) des Lots, an dem derselbe Rabatt zurueckgeschrieben wird"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/bricklink-sale-test.mjs
        env:
          LOT_ID: ${{ inputs.inventory_id }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN_VALUE: ${{ secrets.BRICKLINK_TOKEN_VALUE }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
