# Automatischer Sync: zieht täglich um 08:00 Uhr deutscher Zeit frische Daten aus
# Notion (Zeittracker), YouTube (Abonnenten) und Bricklink (offene Bestellungen /
# Versand-Alarm) und committet sie in data.js. Zwei Cron-Einträge, weil GitHub Actions
# nur UTC kennt und Deutschland zwischen Sommer- (UTC+2) und Winterzeit (UTC+1)
# wechselt — dadurch trifft's ganzjährig um 08:00 Uhr lokal (rund um die
# Zeitumstellung im Frühjahr/Herbst maximal einmal doppelt, harmlos da idempotent).
#
# Jede Datenquelle ist optional: fehlt ein Secret, wird nur diese Quelle übersprungen
# (siehe README für Einrichtung von NOTION_TOKEN, YOUTUBE_API_KEY, BRICKLINK_*).
#
# Manuell anstoßen: Tab "Actions" -> "Sync all dashboard data" -> "Run workflow",
# oder per Klick auf den "Jetzt synchronisieren"-Button im Dashboard selbst.
name: Sync all dashboard data

on:
  schedule:
    - cron: "0 6 * * *" # 08:00 Uhr Sommerzeit (UTC+2)
    - cron: "0 7 * * *" # 08:00 Uhr Winterzeit (UTC+1)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/sync-all.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN_VALUE: ${{ secrets.BRICKLINK_TOKEN_VALUE }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
      - run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js
          git diff --quiet --cached || git commit -m "Automatischer Daten-Sync"
          # Rebase gegen den aktuellen Stand, falls in der Zwischenzeit jemand anderes
          # main aktualisiert hat (z.B. ein manueller Push, oder der lokale Brain-Map-Sync,
          # der zufällig zur selben Zeit läuft) - sonst schlägt der Push fehl. Mit
          # Wiederholung: bei einem echten Konflikt (beide ändern dieselbe Stelle in
          # data.js) bricht der Rebase ab, dann kurz warten und mit frischem Stand erneut
          # versuchen, statt den ganzen Lauf sofort scheitern zu lassen.
          n=0
          until [ $n -ge 5 ]; do
            git pull --rebase origin main && git push && break
            n=$((n+1))
            echo "Push fehlgeschlagen (Versuch $n/5), vermutlich zeitgleicher anderer Push - erneut versuchen..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 8 + 3))
          done
          if [ $n -ge 5 ]; then
            echo "Push nach 5 Versuchen weiterhin fehlgeschlagen."
            exit 1
          fi
